function speedUnsortedCount(){const ks=new Set();EMAILS.forEach(e=>{if(speedScope(e)){const k=senderKey(e);if(!SORTED_SENDERS.has(k))ks.add(k);}});return ks.size;}
function openSpeed(){
  if(BULK.open)closeBulk();

  SPEED.queue=speedBuckets();SPEED.idx=0;SPEED.hist=[];SPEED.group=null;SPEED.finish=false;SPEED.t0=Date.now();SPEED.n0=0;
  const all=EMAILS.filter(speedScope);SPEED.totalE=all.length;SPEED.sortedE=all.filter(e=>SORTED_SENDERS.has(senderKey(e))).length;
  SPEED.sortedS0=new Set(all.map(senderKey).filter(k=>SORTED_SENDERS.has(k))).size;

function closeSpeed(){
  SPEED.open=false;const w=$('speedWrap');if(w){w.classList.remove('show');setTimeout(()=>w.remove(),250);}
  saveState();renderAll();
}
function speedCur(){return SPEED.queue[SPEED.idx]||null;}
function speedCommit(act,group){
  const r=speedCur();if(!r)return;
  const sug=speedSuggest(r);group=group||SPEED.group||sug.group;act=act||sug.act;
  const lists={};const cut=Date.now()-30*864e5;let left=0;
  r.items.forEach(e=>{const o=SPEED.ov[e.id];if(o==='skip'){left++;return;}const d=o||(act==='recent'?((e.ts||0)>=cut?'active':'done'):act);(lists[d]=lists[d]||[]).push(e);});
  const h={r,prevOverride:GROUP_OVERRIDES[r.key],prevRule:AUTO_RULES[r.key],prev:[],act,group,ov:SPEED.ov};
  if(left)toast(left+' left out for you to sort by hand','inbox','They stay where they are.');
  if(group===NOGROUP)delete GROUP_OVERRIDES[r.key];else GROUP_OVERRIDES[r.key]=group;
  if(act==='recent'||act==='active')delete AUTO_RULES[r.key];else AUTO_RULES[r.key]=act;
  SORTED_SENDERS.add(r.key);
  for(const st in lists){if(!lists[st].length)continue;const p=bulkSetState(lists[st],st,{silent:true,noRender:true});if(p)h.prev.push(...p);}
  SPEED.hist.push(h);SPEED.sortedE+=r.items.length;SPEED.n0++;
  SPEED.idx++;SPEED.group=null;SPEED.ov={};SPEED.q='';SPEED.lim=120;
  clearTimeout(SPEED.saveT);SPEED.saveT=setTimeout(()=>{invalidateThreads();saveState();updateBadge();},900);
  renderSpeed(true);
}
function speedUndo(){
  const h=SPEED.hist.pop();if(!h){toast('Nothing to undo','restore');return;}
  if(h.batch){h.batch.forEach(k=>SORTED_SENDERS.delete(k));(h.groups||[]).forEach(([k,v])=>{if(v===undefined)delete GROUP_OVERRIDES[k];else GROUP_OVERRIDES[k]=v;});}
  else{
    if(h.prevOverride===undefined)delete GROUP_OVERRIDES[h.r.key];else GROUP_OVERRIDES[h.r.key]=h.prevOverride;
    if(h.prevRule===undefined)delete AUTO_RULES[h.r.key];else AUTO_RULES[h.r.key]=h.prevRule;
    SORTED_SENDERS.delete(h.r.key);
  }
  const by={};h.prev.forEach(p=>{p.m.state=p.state;p.m.unread=p.unread;p.m.read=p.read;(by[p.state]=by[p.state]||[]).push(p.m);});
  if(Gmail.on){for(const st in by)Gmail.bulkState(by[st],st);Store.putMany(h.prev.map(p=>p.m).filter(m=>m.gid)).catch(()=>{});}
  if(h.batch){SPEED.finish=false;SPEED.idx=h.idx;SPEED.sortedE-=h.emails;SPEED.n0-=h.batch.length;}
  else{SPEED.idx=Math.max(0,SPEED.idx-1);SPEED.queue[SPEED.idx]=h.r;SPEED.sortedE-=h.r.items.length;SPEED.n0--;}
  SPEED.group=h.group||null;SPEED.ov=h.ov||{};SPEED.q='';SPEED.lim=120;invalidateThreads();
  renderSpeed();toast('Undone','restore',h.batch?'Those senders are back in the queue.':(h.r.sample.fromName||'')+' is back on screen.');

function speedSkip(){const r=speedCur();if(!r)return;SPEED.queue.splice(SPEED.idx,1);SPEED.queue.push(r);SPEED.group=null;SPEED.ov={};SPEED.q='';SPEED.lim=120;renderSpeed(true);}
function speedFinish(mode){
  const rest=SPEED.queue.slice(SPEED.idx);if(!rest.length)return;
  const lists={active:[],done:[]};const cut=Date.now()-30*864e5;const groups=[];let emails=0;
  rest.forEach(r=>{
    const person=speedSuggest(r).group==='People'||isPersonalDomain(r.sample.domain)||SPEED.replied.has(r.key);
    if(mode==='split'&&person){r.items.forEach(e=>((e.ts||0)>=cut?lists.active:lists.done).push(e));groups.push([r.key,GROUP_OVERRIDES[r.key]]);GROUP_OVERRIDES[r.key]='People';}

document.addEventListener('keydown',ev=>{
  if(!SPEED.open||document.querySelector('.ge-wrap'))return;
  if(ev.target&&ev.target.closest&&ev.target.closest('input,textarea,select'))return;
  if(ev.key==='/'){ev.preventDefault();const q=$('spQ');if(q)q.focus();return;}
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  const k=ev.key;const hit=()=>{ev.preventDefault();ev.stopPropagation();};
  if(k==='Escape'){hit();if(SPEED.finish){SPEED.finish=false;renderSpeed();}else closeSpeed();return;}
  if(k==='ArrowLeft'||k==='Backspace'){hit();speedUndo();return;}
  if(SPEED.finish||!speedCur()){if(k==='1'||k==='2'){hit();speedFinish(k==='1'?'split':'done');}return;}
  if(k==='ArrowRight'){hit();speedSkip();return;}
  if(k===' '||k==='Enter'){hit();speedCommit();return;}
  if(k==='f'||k==='F'){hit();SPEED.finish=true;renderSpeed();return;}
  if(k==='n'||k==='N'){hit();groupEditor(null,g=>{SPEED.group=g;renderSpeed();});return;}
  if(/^[0-9]$/.test(k)){hit();if(k==='0'){SPEED.group=NOGROUP;}else{const g=speedGroups()[+k-1];if(g)SPEED.group=g;}renderSpeed();return;}
  const a=SPEED_ACTS.find(x=>x[0]===k.toLowerCase());if(a){hit();speedCommit(a[1]);}
},true);

/* ============ BULK SORT: by sender, free, on this device ============ */
function bulkSetState(list,s,opts){
  opts=opts||{};
  const seen=new Set();const msgs=[];
  list.forEach(e=>threadMsgs(e).forEach(m=>{if(!seen.has(m.id)){seen.add(m.id);msgs.push(m);}}));
  for(let i=msgs.length-1;i>=0;i--)if(msgs[i].state===s)msgs.splice(i,1);
  if(!msgs.length)return [];
  const prev=msgs.map(m=>({m,state:m.state,unread:m.unread,read:m.read}));
  msgs.forEach(m=>{m.state=s;if(s!=='active'){m.unread=false;m.read=true;}});
  if(Gmail.on){Gmail.bulkState(msgs,s);Store.putMany(msgs.filter(m=>m.gid)).catch(()=>{});}
  if(s!=='active'&&state.selected&&msgs.some(m=>m.id===state.selected)){state.selected=null;$('reader').classList.remove('open');}
  if(!opts.silent){
    const L={done:'Done',junk:'Junk',spam:'Spam',bin:'Bin',active:'Active'};
    toast(msgs.length.toLocaleString()+' email'+(msgs.length===1?'':'s')+' moved to '+L[s],s==='done'?'tick':s==='active'?'restore':'trash',opts.note||'Nothing deleted. Undo puts them all back.','',null,{label:'Undo',fn:()=>bulkUndo(prev)},9000);
  }
  if(!opts.noRender)renderAll();
  return prev;
}
function bulkUndo(prev){
  const by={};prev.forEach(p=>{p.m.state=p.state;p.m.unread=p.unread;p.m.read=p.read;(by[p.state]=by[p.state]||[]).push(p.m);});

  toast('Put back','restore',prev.length.toLocaleString()+' emails are where they were.');
  renderAll();if(BULK.open)renderBulk();
}
function applyAutoRules(list){

  list.forEach(e=>{if(e.me||e.state!=='active')return;const r=AUTO_RULES[senderKey(e)];if(r&&r!=='active'){(by[r]=by[r]||[]).push(e);n++;}});

}

  list=list.filter(Boolean);if(!list.length)return;
  const threads=[...new Set(list.map(threadKey))];
  const msgs=EMAILS.filter(m=>threads.includes(threadKey(m)));
  if(!confirm('Delete '+threads.length+' conversation'+(threads.length===1?'':'s')+' ('+msgs.length+' email'+(msgs.length===1?'':'s')+') forever?\n\nThey disappear from SmartMail now. '+(Gmail.on?'In Gmail they go to Trash, which Google empties after 30 days, so you have a month to change your mind there.':'')))return;
  if(Gmail.on){
    const byAcc={};msgs.forEach(m=>{if(m.gid&&m.thread&&m.thread.startsWith('g:')){(byAcc[m.account]=byAcc[m.account]||new Set()).add(m.thread.slice(2));}});
    Object.entries(byAcc).forEach(([accId,set])=>{const acc=Gmail.accounts.find(a=>a.id===accId);if(!acc)return;[...set].forEach(tid=>Gmail.api(acc,'threads/'+tid+'/trash',{method:'POST',prio:true}).catch(err=>toast('Gmail did not accept a delete','bell',err.message)));});
    Store.delKeys(msgs.filter(m=>m.gid).map(m=>m.account+':'+m.gid));
  }
  const ids=new Set(msgs.map(m=>m.id));
  for(let k=EMAILS.length-1;k>=0;k--)if(ids.has(EMAILS[k].id))EMAILS.splice(k,1);
  if(ids.has(state.selected)){state.selected=null;$('reader').classList.remove('open');}
  threads.forEach(t=>BINSEL.set.delete(t));
  toast('Deleted '+msgs.length+' email'+(msgs.length===1?'':'s')+' forever','trash');
  renderAll();
}

function attachDrag(card,id){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const stamps={keep:card.querySelector('.stamp.keep'),hide:card.querySelector('.stamp.hide'),reply:card.querySelector('.stamp.reply'),leave:card.querySelector('.stamp.leave')};
  card.addEventListener('pointerdown',ev=>{
    drag=true;sx=ev.clientX;sy=ev.clientY;card.classList.add('dragging');card.setPointerCapture(ev.pointerId);
  });
  card.addEventListener('pointermove',ev=>{
    if(!drag)return;
    dx=ev.clientX-sx;dy=ev.clientY-sy;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx*0.06}deg)`;
    stamps.keep.style.opacity=Math.max(0,Math.min(1,dx/80));
    stamps.hide.style.opacity=Math.max(0,Math.min(1,-dx/80));
    stamps.reply.style.opacity=Math.max(0,Math.min(1,(-dy-40)/80*(Math.abs(dx)<60?1:0)));
    stamps.leave.style.opacity=Math.max(0,Math.min(1,(dy-40)/80*(Math.abs(dx)<60?1:0)));
  });
  const up=()=>{
    if(!drag)return;drag=false;card.classList.remove('dragging');
    if(dy<-110&&Math.abs(dx)<80)resolveCard(card,id,'reply');
    else if(dy>110&&Math.abs(dx)<80)resolveCard(card,id,'leave');
    else if(dx>110)resolveCard(card,id,'keep');
    else if(dx<-110)resolveCard(card,id,'junk');
    else{card.style.transform='';Object.values(stamps).forEach(s=>s.style.opacity=0);}
    dx=dy=0;
  };
  card.addEventListener('pointerup',up);
  card.addEventListener('pointercancel',up);
}
function resolveCard(card,id,action){
  const e=emailById(id);if(!e)return;
  if(action==='leave'){SKIPPED.add(threadKey(e));}
  else{
    const dest=action==='keep'||action==='reply'?'active':action;
    logDecision(e,dest);
    threadMsgs(e).forEach(m=>{m.state=dest;});
    if(action==='reply')e.flagged=true;
  }
  const off=(action==='keep'||action==='done')?'120%':(action==='junk'||action==='spam'||action==='bin')?'-120%':'0';
  card.style.transform=action==='reply'?'translateY(-140%) rotate(0)':action==='leave'?'translateY(140%) rotate(0)':`translateX(${off}) rotate(${off.startsWith('-')?-14:14}deg)`;
  card.style.opacity='0';
  setTimeout(()=>{renderTriage();renderSidebar();renderList();},230);
}

let LAST_SENT=null;
function preflight(snap){
  const out=[];
  const split=v=>String(v||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean).flatMap(x=>/<[^>]+>/.test(x)?[x.match(/<([^>]+)>/)[1].trim()]:x.split(/\s+/));
  const okAddr=a=>/^[^@\s<>]+@[^@\s<>]+\.[^@\s<>]{2,}$/.test(a);
  const addrs=split(snap.to);
  const bad=[...addrs,...split(snap.cc),...split(snap.bcc)].filter(a=>!okAddr(a));
  if(!addrs.length)out.push({level:'bad',text:'No recipient. Add who this is going to.'});
  if(bad.length)out.push({level:'bad',text:'This address does not look right: '+bad.join(', ')});
  if((snap.attachments||[]).some(f=>f&&!f.gmail&&!(f.file instanceof Blob)))out.push({level:'bad',text:'An attachment from a saved draft needs adding again (files are not kept once the app reloads). Remove it and attach it again.'});
  const total=(snap.attachments||[]).reduce((a,f)=>a+f.size,0);
  if(total>25*1024*1024)out.push({level:'bad',text:'Attachments are '+fmtSize(total)+'. Gmail refuses anything over 25 MB, so this would bounce. Remove some, or share a Drive link instead.'});
  if(!snap.subject)out.push({level:'warn',text:'No subject. It will send, but emails with no subject are more likely to be ignored or land in spam.'});
  if(!snap.body)out.push({level:'warn',text:'The email is empty.'});
  const bodyNoSubj=(snap.body||'').split(snap.subject.replace(/^(re:\s*)+/i,'')).join(' ');
  const bodyNoQuotes=bodyNoSubj.replace(/["“][^"”]*["”]/g,'');
  if(/\b(I(?:'ve| have)? attached|attached (?:is|are|below|here|a|the)|see attached|please find attached|find attached|attachments?\b|attaching|enclosed)/i.test(bodyNoQuotes)&&!(snap.attachments||[]).length)out.push({level:'warn',text:'You mention an attachment but nothing is attached.'});
  if(snap.body.length>80000)out.push({level:'warn',text:'This is very long ('+Math.round(snap.body.length/1000)+'k characters). Gmail clips long emails for the reader.'});
  if(LAST_SENT&&Date.now()-LAST_SENT.at<120000&&LAST_SENT.key===snap.to+'|'+snap.subject+'|'+snap.body.slice(0,80))out.push({level:'warn',text:'You sent an identical email to the same person less than two minutes ago. Send again anyway?'});
  if(!out.length)out.push({level:'ok',text:'Recipient, subject and size all look fine.'});
  return out;
}

function queueSend(snap){

  let words=subj.split(/\s+/);
  let w=words.slice(0,8).join(' ').replace(/[,.;:]+$/,'').replace(/\s+(this|the|a|an|to|for|of|and|your|is|are|on|in|at|by)$/i,'');
  const has=(txt,v)=>txt.toLowerCase().replace(/[^a-z0-9£]/g,'').includes(v.toLowerCase().replace(/\.00$/,'').replace(/[^a-z0-9£]/g,''));
  if(money&&!has(w,money[0]))w+=', '+money[0].replace(/\.00$/,'');

function generateDraftRules(intent){
  const e=state.composing&&state.composing.emailId?emailById(state.composing.emailId):null;
  let draft;
  const first=e?firstName(e.fromName):'';
  const parsed=parseIntent(intent);
  if(e){
    if(parsed.sentences.length){
      draft=`Hi ${first},\n\nThanks for your email. ${parsed.sentences.join(' ')}\n\n${parsed.asks?'Let me know if that works for you.':'Let me know if you need anything else.'}\n\nBest,\nLuca`;
    }else{
      draft=`Hi ${first},\n\nThanks for this, all received. I will come back to you properly on "${e.subject.replace(/^Re: /,'')}" shortly.\n\nBest,\nLuca`;
    }
  }else{
    if(!intent){toast('Describe the email first, e.g. "chase the plumber about Friday"','sparkle');return;}
    const to=parsed.name?`Hi ${parsed.name},`:'Hi,';
    const formal=parsed.tone.professional||parsed.tone.formal||parsed.tone.smart;
    draft=`${formal&&parsed.name?`Dear ${parsed.name},`:to}\n\n${parsed.sentences.join(' ')}\n\n${parsed.asks?(formal?'I would be grateful if you could let me know at your convenience.':'Thanks very much, let me know if you have any questions.'):(formal?'Thank you for your time.':'Thanks very much.')}\n\n${formal?'Kind regards':'Best'},\nLuca`;
    setSubjectFromIntent(intent);
  }
  draft=applyRules(draft);
  if(SIG_ON&&sigText(currentComposeAccount()))draft=draft.replace(/\n\n(Best|Kind regards|Thanks|Regards|Cheers),\nLuca$/,'');
  setBody(draft);composeChanged();
  toast('Draft written with the built-in writer','sparkle');
}
function parseIntent(intent){
  let t=(intent||'').trim();
  // tone instructions are not content
  const tone={};
  const TONE='(professional|smart|polite|formal|friendly|casual|firm|short|brief|warm|apologetic)';
  t=t.replace(new RegExp('[,.]?\\s*(?:and\\s+)?(?:please\\s+)?(?:make|keep|have)\\s+(?:it|this|the email|the tone)\\s+(?:sound\\s+|read\\s+|come across\\s+|be\\s+|written\\s+)?(?:a bit\\s+|really\\s+|very\\s+|quite\\s+|kind of\\s+|slightly\\s+)?'+TONE+'\\b[^,.]*','gi'),(m,w)=>{tone[w.toLowerCase()]=true;return '';});
  t=t.replace(new RegExp('[,.]?\\s*(?:and\\s+)?(?:sounding|sound|written|phrased)\\s+(?:a bit\\s+|really\\s+|very\\s+|quite\\s+)?'+TONE+'\\b[^,.]*','gi'),(m,w)=>{tone[w.toLowerCase()]=true;return '';});
  t=t.replace(new RegExp('[,.]?\\s*(?:in\\s+)?(?:a\\s+)?'+TONE+'\\s+(?:tone|style|way|manner)\\b[^,.]*','gi'),(m,w)=>{tone[w.toLowerCase()]=true;return '';});
  t=t.trim();
  t=t.replace(/[,.]\s*$/,'');
  // common typos first, so the patterns below can rely on real words
  t=t.replace(/\byuo\b/gi,'you').replace(/\bjsut\b/gi,'just').replace(/\bsyaing\b/gi,'saying').replace(/\bteh\b/gi,'the').replace(/\badn\b/gi,'and');
  let name='';
  const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
  // "write an email to my thumbnail client tim, just saying ..." / "email tim saying ..."
  let m=t.match(/^(?:write|send|draft|compose)?\s*(?:an?\s+)?(?:quick\s+)?(?:email|message|note)?\s*(?:to\s+)?(?:my\s+|the\s+)?(.+?)[\s,]+(?:just\s+)?(?:saying|to say|asking|telling|to tell|to ask|about|that)\s+/i);
  if(m){const who=m[1].trim().split(/\s+/);name=cap(who[who.length-1]);t=t.slice(m[0].length);}
  else{
    // "tell sarah yes to tuesday ..." / "ask tom if ..." / "chase the plumber about friday"
    m=t.match(/^(tell|ask|email|message|chase|remind|thank)\s+(?:my\s+|the\s+)?([a-z]+)\s+/i);
    if(m&&!/^(them|him|her|the|my|if|whether|about|that)$/i.test(m[2])){name=cap(m[2]);t=(m[1].toLowerCase()==='ask'?'ask ':m[1].toLowerCase()==='chase'?'chase ':m[1].toLowerCase()==='thank'?'thank ':'')+t.slice(m[0].length);}
  }
  const askingLead=/^(?:asking|ask(?:ing)? (?:them|him|her)|to ask|could you ask|check)\b/i.test(intent.trim())||/(?:asking|to ask)\s+/i.test((intent.match(/^.*?(?:asking|to ask)\s+/i)||[''])[0]);
  if(askingLead&&!/^(ask|check)\b/i.test(t))t='ask '+t;
  const parts=t.split(/\s*(?:,\s*(?:also|and|then)\s+|\balso\b|\band then\b|\band (?=(?:ask|tell|check|say|mention|let|remind|if|whether|when|what|how|could|can)\b)|\bplus\b|;)\s*/i).map(x=>x&&x.trim()).filter(Boolean);
  let askMode=askingLead;
  let asks=false;
  const days=/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/gi;
  const sentences=parts.map(p=>{
    let x=p.replace(/^(and|also|just|then)\s+/i,'');
    x=x.replace(/^(say|tell (them|him|her)|let (them|him|her) know|mention)\s+(that\s+)?/i,'');
    x=x.replace(/\bi'?m\b/g,'I am').replace(/\bi\b/g,'I').replace(days,d=>cap(d.toLowerCase()));
    if(/^thank\b/i.test(x)){x=x.replace(/^thank\s+(them|him|her)?\s*(for\s+)?/i,'Thank you for ');if(!/[.!?]$/.test(x))x+='.';return x;}
    if(askMode&&/^(if|whether|when|what|how|could|can)\b/i.test(x))x='ask '+x;
    if(/^(ask|check|chase|see|when you get a chance|if you get a chance)\b/i.test(x)){asks=true;
      let pre='';
      if(/^(when|if) you get a chance/i.test(x)){pre='When you get a chance, ';x=x.replace(/^(when|if) you get a chance,?\s*(to\s+|could you\s+|can you\s+|please\s+)?/i,'');}
      x=x.replace(/^(ask|check|chase|see)\s+(them|him|her)?\s*/i,'');
      if(/^(if|whether)\s+/i.test(x)){x='let me know '+x.replace(/^(if|whether)\s+/i,'whether ');}
      else if(/^(what|how|when|where|which)\b/i.test(x)){x='let me know '+x;}
      x=x.replace(/^(about|on)\s+/i,'give me an update on ');
      x=x.replace(/^(they|he|she|you)\s+(can|could)\s+/i,'').replace(/^(can|could)\s+you\s+/i,'').replace(/^to\s+/,'');
      x=(pre?pre+'could you ':'Could you ')+x.replace(/[.!?]+$/,'')+'?';
    }else{
      x=x.replace(/^yes\s+to\s+(.+)$/i,(_,r)=>'Yes, '+r.replace(/[.!?]+$/,'')+' works for me');
      x=x.replace(/^no\s+to\s+(.+)$/i,(_,r)=>'Unfortunately '+r.replace(/[.!?]+$/,'')+' does not work for me');
      x=x.replace(/^(the work|it|everything)\s+is on (its|the) way\b/i,'$1 is on its way');
      if(!/[.!?]$/.test(x))x+='.';
    }
    return cap(x);
  });
  // merge back-to-back questions: "Could you let me know X? Could you let me know Y?" -> one sentence
  for(let i=0;i<sentences.length-1;i++){
    const a=sentences[i],b=sentences[i+1];const m=/^Could you let me know (.+)\?$/;
    if(m.test(a)&&m.test(b)){sentences.splice(i,2,'Could you let me know '+a.match(m)[1]+', and '+b.match(m)[1]+'?');i--;}
  }
  return {name,sentences,asks,tone};
}

function rankVoice(v){
  let sc=0;const n=v.name,l=v.lang||'';
  if(/en-GB/i.test(l))sc+=40;else if(/^en/i.test(l))sc+=20;
  if(/premium|enhanced|natural|neural/i.test(n))sc+=30;
  if(/Jamie|Oliver|Serena|Kate|Daniel|Arthur|Martha|Stephanie|Moira|Fiona/i.test(n))sc+=15;
  if(/Google UK English/i.test(n))sc+=18;
  if(/Microsoft .*(Sonia|Ryan|Libby|Thomas).*Online|Natural/i.test(n))sc+=35;
  if(/compact|eloquence|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Wobble|Zarvox|Trinoids|Whisper|Organ|Jester|Junior|Ralph|Fred|Kathy|Superstar|Grandma|Grandpa|Rocko|Shelley|Sandy|Flo|Eddy|Reed/i.test(n))sc-=50;
  if(v.localService)sc+=2;
  return sc;
}
function bestVoice(){
  const vs=voiceList();if(!vs.length)return null;
  const saved=(()=>{try{return localStorage.getItem('sm-voice');}catch(e){return null;}})();

function readAloud(text,btn){
  if(!window.speechSynthesis){toast('This browser cannot read aloud','bell');return;}
  if(READING&&READING.btn===btn){stopReading();return;}
  stopReading();
  const t=(text||'').trim();if(!t){toast('Nothing to read yet','bell');return;}
  const idle=btn.innerHTML;btn.classList.add('on');if(!btn.classList.contains('read-bub'))btn.innerHTML=ic('stop',12)+' Stop';
  READING={btn,idle,text:t};paintReadBar();
  const parts=t.replace(/\n+/g,'. ').replace(/\.\s*\./g,'.').split(/(?<=[.!?])\s+/).filter(x=>x.trim());
  const v=bestVoice();let i=0;
  const next=()=>{
    if(!READING||READING.btn!==btn)return;
    if(i>=parts.length){stopReading();return;}
    const u=new SpeechSynthesisUtterance(parts[i++]);if(v){u.voice=v;u.lang=v.lang;}u.rate=readRate();u.pitch=1;
    u.onend=next;u.onerror=next;speechSynthesis.speak(u);
  };
  next();
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{voiceList();const sv=$('setVoice');if(sv)fillVoices(sv);};

function intentToSentence(intent){
  let s=intent.replace(/^(say|tell them|reply|respond)\s+/i,'');
  s=s.charAt(0).toUpperCase()+s.slice(1);
  if(!/[.!?]$/.test(s))s+='.';
  return s;
}
function applyRules(text){
  let t=text;
  STYLE_RULES.forEach(r=>{
    const rl=r.toLowerCase();
    if(rl.includes('dash')||r.includes('—')){t=t.replace(/\s*—\s*/g,', ').replace(/\s+-\s+/g,', ');}
    if(rl.includes('hope you are well')||rl.includes("hope you're well")){t=t.replace(/Hope you('| a)re well\.?\s*/gi,'');}
    if(rl.match(/sign off as ["']?([\w ]+)["']?/)){const m=rl.match(/sign off as ["']?([\w ]+)["']?/);t=t.replace(/\nLuca$/,'\n'+m[1].trim().replace(/^\w/,c=>c.toUpperCase()));}
  });
  return t;
}

function toast(title,icoName,sub,gist,onClick,action,ms){

  if(onClick)t.onclick=()=>{onClick();t.remove();};
  if(action){const b=t.querySelector('.t-act');b.onclick=ev=>{ev.stopPropagation();action.fn();t.remove();};}

let incomingIdx=0;
function simulateIncoming(){
  if(Gmail.on)return;
  const tpl=INCOMING[incomingIdx%INCOMING.length];incomingIdx++;
  const e=mk(Object.assign({},tpl,{time:'Now',day:'Today',unread:true,read:false,triaged:false}));
  // a reply to a conversation you had filed away pulls the whole conversation back into Active
  const prior=e.thread?EMAILS.filter(x=>threadKey(x)===e.thread):[];
  const wasIn=prior.length&&prior[0].state!=='active'?prior[0].state:null;
  EMAILS.unshift(e);
  if(wasIn){prior.forEach(m=>{m.state='active';});e.triaged=true;}
  if(Engine.kind!=='rules')Engine.gist(e).then(g=>{e.gist=g;renderList();});
  const g=groupOf(e);
  if(PREFS.notif&&PREFS.acctNotif[e.account]!==false)toast(wasIn?e.fromName+' replied, conversation back in Active':'New email · '+e.fromName,wasIn?'reply':'bell',wasIn?'It was in '+DEST_LABEL[wasIn]+'. All '+(prior.length+1)+' emails moved together.':'Auto-filed into '+g+' · '+acctShort(e.account),PREFS.gistAlert?e.gist:'',()=>{openEmail(e.id);});
  renderAll();
}

      const when=new Date(orig.ts||Date.now()).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const head='---------- Forwarded message ---------\nFrom: '+(orig.fromName||'')+' <'+orig.fromEmail+'>\nDate: '+when+'\nSubject: '+orig.subject+'\nTo: '+(orig.to||acc.email)+'\n\n';
      qText='\n\n'+head+(orig.body||[]).join('\n\n');
      qHtml='<br><br><div>'+esc(head).replace(/\n/g,'<br>')+'</div>'+(HTMLMEM.get(orig.account+':'+orig.gid)?cleanMailHtml(HTMLMEM.get(orig.account+':'+orig.gid)).replace(/<\/?(html|head|body)[^>]*>/gi,''):(orig.body||[]).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join(''));
    }
    const text=(d.body||'')+sig+qText;
    const htmlSig=d.signature?'<br><br>--<br>'+esc(d.signature).replace(/\n/g,'<br>'):'';
    const userHtml=d.html&&/<(b|i|u|a |ul|ol|font|span style|div|br)/i.test(d.html)?d.html:esc(d.body||'').replace(/\n/g,'<br>');
    const html='<div style="font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:14px">'+userHtml+htmlSig+'</div>'+qHtml;
    let headers='From: '+fromHdr+'\r\nTo: '+d.to+'\r\n';
    if(d.cc)headers+='Cc: '+d.cc+'\r\n';
    if(d.bcc)headers+='Bcc: '+d.bcc+'\r\n';
    headers+='Subject: '+enc(d.subject||'')+'\r\nMIME-Version: 1.0\r\n';
    if(orig&&orig.msgId&&d.mode!=='forward')headers+='In-Reply-To: '+orig.msgId+'\r\nReferences: '+((orig.refs||'')+' '+orig.msgId).trim()+'\r\n';
    const B1='alt'+Date.now(),B2='mix'+Date.now();
    const alt='Content-Type: multipart/alternative; boundary="'+B1+'"\r\n\r\n--'+B1+'\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap(b64(text))+'--'+B1+'\r\nContent-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap(b64(html))+'--'+B1+'--\r\n';
    const isFile=a=>a&&a.file&&typeof Blob!=='undefined'&&a.file instanceof Blob;
    const atts=(d.attachments||[]).filter(a=>isFile(a)||(a&&a.gmail));
    if((d.attachments||[]).some(a=>a&&!isFile(a)&&!a.gmail))throw new Error('An attachment needs adding again (attachments are not kept in saved drafts after the app reloads)');
    let raw;
    if(atts.length){
      let parts='';
      for(const a of atts){
        let data,mime=a.type||a.mime||'application/octet-stream';
        if(isFile(a))data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(new Error('Could not read '+a.name));fr.readAsDataURL(a.file);});
        else{const src=emailById(a.gmail.emailId);const got=await this.attachmentData(src,a.gmail.att);data=got.b64;mime=got.mime;}
        const fn=enc(a.name).replace(/"/g,'');
        parts+='--'+B2+'\r\nContent-Type: '+mime+'; name="'+fn+'"\r\nContent-Disposition: attachment; filename="'+fn+'"\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap(data);
      }
      raw=headers+'Content-Type: multipart/mixed; boundary="'+B2+'"\r\n\r\n--'+B2+'\r\n'+alt+parts+'--'+B2+'--\r\n';
    }else raw=headers+alt;
    const threadId=orig&&d.mode!=='forward'&&orig.thread&&orig.thread.startsWith('g:')?orig.thread.slice(2):null;
    if(raw.length>34*1024*1024)throw new Error('This email is over Gmail\'s 25 MB limit. Remove an attachment or send a Drive link');
    if(raw.length<3.5*1024*1024){
      const body={raw:btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};if(threadId)body.threadId=threadId;
      return await this.api(acc,'messages/send',{method:'POST',body:JSON.stringify(body),prio:true});
    }
    // big attachments: Gmail's upload route (up to 35 MB)
    if(!(await this.ensureToken(acc))){const x=new Error('Waiting for you to confirm Google sign-in');x.auth=true;throw x;}
    const BU='up'+Date.now();
    const payload='--'+BU+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(threadId?{threadId}:{})+'\r\n--'+BU+'\r\nContent-Type: message/rfc822\r\n\r\n'+raw+'\r\n--'+BU+'--';
    const r=await fetch('https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+acc.token,'Content-Type':'multipart/related; boundary='+BU},body:payload});
    if(!r.ok){let msg='Gmail error '+r.status;try{const j=await r.json();msg=(j.error&&j.error.message)||msg;}catch(x){}throw new Error(msg);}
    return r.json();
  },
  async refresh(manual){
    if(!this.on||this.holdSync)return;
    if(this.busy){if(manual)this._again=true;return;}
    this.busy=true;this.paintStatus();
    let ok=0;
    for(const acc of this.accounts){if(acc.needsTap)continue;try{await this.fetchAccount(acc,false);ok++;}catch(e){console.warn(e);}}
    if(ok)this.lastCheck=Date.now();
    this.busy=false;this.paintStatus();
    if(manual&&!ok&&this.accounts.some(a=>a.needsTap))toast('Gmail is paused','bell','Click the orange bar at the bottom to carry on.');
    if(this._again){this._again=false;this.refresh();}
  },
  paintStatus(){
    if(!this.on)return;
    let el=$('syncStat');
    if(!el){
      el=document.createElement('button');el.id='syncStat';el.className='sync-stat';
      $('listTitle').insertAdjacentElement('afterend',el);
      el.onclick=()=>{const a=this.accounts.find(x=>x.needsTap);if(a){a.exp=0;this.ensureToken(a).then(okk=>{if(okk)this.refresh(true);});}else this.refresh(true);};
    }
    const ago=t=>{if(!t)return '';const s=Math.round((Date.now()-t)/1000);return s<10?'just now':s<60?s+'s ago':s<3600?Math.floor(s/60)+' min ago':Math.floor(s/3600)+' h ago';};
    const paused=this.accounts.length&&this.accounts.every(a=>a.needsTap);
    const last=EMAILS.reduce((m,e)=>(e.gid&&!e.me&&e.ts>m?e.ts:m),0);
    const lastTxt=last?(()=>{const d=new Date(last),n=new Date();const hm=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return d.toDateString()===n.toDateString()?hm:d.toLocaleDateString([],{day:'numeric',month:'short'})+' '+hm;})():'';
    el.classList.toggle('spin',!!this.busy);el.classList.toggle('paused',!!paused);
    el.innerHTML=`<span class="ss-ico">${ic('refresh',13)}</span><span class="ss-txt">${this.busy?'Checking…':paused?'Paused':this.lastCheck?'Updated '+ago(this.lastCheck):'Not checked yet'}</span>${lastTxt?`<span class="ss-last">· newest ${lastTxt}</span>`:''}`;
    el.dataset.tip='Refresh|'+(lastTxt?'Newest email arrived at '+lastTxt+'. ':'')+'SmartMail checks Gmail every 45 seconds and whenever you come back to the window. Click to check now.';
    el.setAttribute('aria-label','Refresh mail. '+(this.lastCheck?'Updated '+ago(this.lastCheck):''));
  },
  start(){
    if(!this.on)return;
    clearInterval(this._st);this._st=setInterval(()=>this.paintStatus(),10000);this.paintStatus();
    clearInterval(this.pollTimer);this.pollTimer=setInterval(()=>this.refresh(),45000);
    if(!this._wired){this._wired=true;
      const soon=()=>{if(!this.lastCheck||Date.now()-this.lastCheck>15000)this.refresh();};
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)soon();});
      window.addEventListener('focus',soon);window.addEventListener('online',()=>this.refresh());}
  },
  async boot(){
    this.load();
    if(!this.on)return false;
    this.syncAccountsList();
    this.loadingLocal=true;renderAll();
    try{const saved=await Store.all();EMAILS.length=0;const ids=new Set(this.accounts.map(a=>a.id));saved.filter(e=>ids.has(e.account)).forEach(e=>EMAILS.push(mk(e)));EMAILS.sort((a,b)=>(b.ts||0)-(a.ts||0));}catch(e){console.warn('store',e);}
    this.loadingLocal=false;renderAll();this.keepAlive();
    for(const acc of this.accounts){
      try{if(!this.labelIds[acc.email])await this.ensureLabels(acc);await this.fetchAccount(acc,true);this.lastCheck=Date.now();}
      catch(err){if(!err.auth)toast('Could not load '+acc.email,'bell',err.message+'. It will try again shortly.');}
    }
    this.start();this.ready=true;
    this.maybeReset();
    if(this.accounts.some(a=>{try{return !localStorage.getItem('sm-mig-arch-'+a.id);}catch(e){return false;}}))setTimeout(()=>{if(!this._resetPending)this.resyncAll('migrate');},1500);
    return true;
  }
};

/* ============ SIDEBAR SPLIT (drag the Mail box up for more groups; snaps back near the bottom, double-click or refresh resets) ============ */
(function(){
  const h=$('splitHandle'),top=$('sideNav').previousElementSibling;
  const MIN=118,SNAP=14;
  let drag=null;
  function natural(){const mh=top.style.maxHeight;top.style.maxHeight='';const n=top.getBoundingClientRect().height;top.style.maxHeight=mh;return n;}
  function apply(px,nat){
    if(px>=nat-SNAP){top.style.maxHeight='';top.classList.remove('clipped');return;}
    top.style.maxHeight=px+'px';top.classList.add('clipped');
  }
  h.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    const nat=natural();
    drag={y:ev.clientY,h:top.getBoundingClientRect().height,nat};
    top.classList.add('dragging');h.classList.add('on');h.setPointerCapture(ev.pointerId);
  });
  h.addEventListener('pointermove',ev=>{
    if(!drag)return;
    const px=Math.max(MIN,Math.min(drag.nat,drag.h+(ev.clientY-drag.y)));
    top.style.maxHeight=px+'px';top.classList.toggle('clipped',px<drag.nat-1);
    placeAcct();
  });
  function end(ev){
    if(!drag)return;
    const px=Math.max(MIN,Math.min(drag.nat,drag.h+(ev.clientY-drag.y)));
    top.classList.remove('dragging');h.classList.remove('on');
    apply(px,drag.nat);drag=null;
    setTimeout(placeAcct,480);
  }
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  // show the grip only while the pointer is really over it (hover state goes stale after a captured drag)
  const over=(x,y)=>{const el=document.elementFromPoint(x,y);return !!(el&&el.closest('#splitHandle'));};
  h.addEventListener('pointerenter',()=>h.classList.add('hover'));
  h.addEventListener('pointerleave',()=>{if(!drag)h.classList.remove('hover');});
  h.addEventListener('pointerup',ev=>{const x=ev.clientX,y=ev.clientY;setTimeout(()=>h.classList.toggle('hover',over(x,y)),0);setTimeout(()=>h.classList.toggle('hover',over(x,y)),500);});
  document.addEventListener('pointermove',ev=>{if(!drag&&h.classList.contains('hover')&&!over(ev.clientX,ev.clientY))h.classList.remove('hover');},{passive:true});
  h.addEventListener('dblclick',()=>{top.style.maxHeight='';top.classList.remove('clipped');setTimeout(placeAcct,480);});
})();

/* ============ FLOATING SIMULATE TAB (prototype only) ============ */
(function(){
  const el=$('simFloat');
  $('simIco').innerHTML=ic('bell',15);
  let side='r',y=Math.round(window.innerHeight*0.6);
  let dragging=false,moved=false,sx=0,sy=0,ox=0,oy=0,x=0;
  function clampY(v){return Math.max(10,Math.min(window.innerHeight-el.offsetHeight-10,v));}
  function dock(){
    y=clampY(y);
    x=side==='l'?0:window.innerWidth-el.offsetWidth;
    el.dataset.side=side;
    el.style.transform='translate('+x+'px,'+y+'px)';
  }
  el.addEventListener('pointerdown',ev=>{
    if(ev.button!==undefined&&ev.button!==0)return;
    dragging=true;moved=false;sx=ev.clientX;sy=ev.clientY;ox=x;oy=y;
    el.setPointerCapture(ev.pointerId);el.classList.add('pressed');
  });
  el.addEventListener('pointermove',ev=>{
    if(!dragging)return;
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<5)return;
    if(!moved){moved=true;el.classList.add('dragging');}
    x=Math.max(0,Math.min(window.innerWidth-el.offsetWidth,ox+dx));
    y=clampY(oy+dy);
    el.style.transform='translate('+x+'px,'+y+'px)';
  });
  function end(){
    if(!dragging)return;
    dragging=false;el.classList.remove('pressed');
    if(moved){
      side=(x+el.offsetWidth/2)<window.innerWidth/2?'l':'r';
      el.classList.remove('dragging');
      dock();
    }
  }
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('click',()=>{if(moved){moved=false;return;}simulateIncoming();});
  window.addEventListener('resize',()=>{el.style.transition='none';dock();void el.offsetWidth;el.style.transition='';});
  dock();
  requestAnimationFrame(dock);
})();

/* ============ KEYBOARD ============ */
document.addEventListener('keydown',ev=>{
  const inField=ev.target.closest('input,textarea,[contenteditable],select');
  const mod=ev.metaKey||ev.ctrlKey;
  if(ev.key==='Escape'&&state.listFilter==='bin'&&BINSEL.set.size&&!inField){BINSEL.set.clear();renderListInner();return;}
  if(ev.key==='Escape'){
    const pop=$('gistPop');if(pop&&!pop.hidden){pop.hidden=true;return;}
    if($('askSheet')){closeAsk();return;}
    if(!$('triageOverlay').hidden){closeTriage();return;}
    if(state.composing){closeCompose();return;}
    if(state.sigEdit){closeSigEditor();return;}
    if(state.settings){leaveSettings();renderAll();return;}
    if(state.personSel){state.personSel=null;$('reader').classList.remove('open');renderList();renderReader();return;}
    if(state.noteSel){closeNote();return;}
    if(state.selected){state.selected=null;$('reader').classList.remove('open');renderList();renderReader();return;}
    return;
  }
  if(state.listFilter==='bin'&&!inField&&state.view.type!=='reply'&&!state.composing){
    if(mod&&ev.key.toLowerCase()==='a'){ev.preventDefault();BINSEL.list.forEach(e=>BINSEL.set.add(threadKey(e)));renderListInner();return;}
    if((ev.key==='Backspace'||ev.key==='Delete')&&BINSEL.set.size){ev.preventDefault();deleteForever(binPicked());return;}
    if(ev.key==='Escape'&&BINSEL.set.size){BINSEL.set.clear();renderListInner();return;}
  }
  if(mod&&ev.key==='Enter'&&state.composing){ev.preventDefault();const b=$('sendBtn');if(b)b.click();return;}
  if(inField)return;
  if(mod&&ev.key.toLowerCase()==='n'){ev.preventDefault();$('composeNew').click();return;}
  if(ev.key==='/'){ev.preventDefault();$('searchInput').focus();return;}
  if(!mod&&state.selected&&!state.composing){
    const e=emailById(state.selected);if(!e)return;
    const k=ev.key.toLowerCase();
    if(ev.key==='F'&&ev.shiftKey){ev.preventDefault();openCompose(e,'forward');}
    else if(k==='r'){ev.preventDefault();openCompose(e);}
    else if(k==='a'){ev.preventDefault();openCompose(e,'replyall');}
    else if((ev.key==='Backspace'||ev.key==='Delete')&&state.listFilter!=='bin'){ev.preventDefault();logDecision(e,'bin');setEmailState(e,'bin');}
    else if(k==='d'){logDecision(e,'done');setEmailState(e,'done');}
    else if(k==='j'){logDecision(e,'junk');setEmailState(e,'junk');}
    else if(k==='f'){e.flagged=!e.flagged;if(Gmail.on)Gmail.setFlag(e);renderAll();}
  }
});
/* keep sliding indicators aligned when sizes change */
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>placeAll());
  ['acctSwitch','sideSmart','grpWrap','segFilter','sidebar'].forEach(i=>ro.observe($(i)));
}
document.fonts&&document.fonts.ready&&document.fonts.ready.then(placeAll);
/* ============ REMEMBER YOUR OWN DATA BETWEEN VISITS (settings, signatures, notes, drafts, rules, groups, what the sorter learned) ============ */
const SAVE_KEY='smartmail-proto-v1';
function saveSnapshot(){
  if(!Gmail.on||Gmail.loadingLocal)return;
  try{const pick=EMAILS.filter(e=>e.gid&&(e.state==='active'||e.flagged)).slice(0,300).concat(EMAILS.filter(e=>e.gid&&e.state!=='active').slice(0,60));
    localStorage.setItem('sm-snap',JSON.stringify(pick.map(e=>{const o=Store.strip(e);o.body=[e.snippet||''];o.snap=1;return o;})));}catch(e){}
}
function saveState(){saveSnapshot();
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({ACCOUNTS,removedDemo:true,PREFS,SIGS,STYLE_RULES,NOTES,nextNote,DRAFTS,nextDraft,DECISIONS,GROUP_OVERRIDES,AUTO_RULES,SORTED_SENDERS:[...SORTED_SENDERS],CUSTOM_ICONS,CUSTOM_GROUPS,CONTACT_NOTES,CONTACT_PINS:[...CONTACT_PINS],openGroups:state.openGroups,sigAcct:state.sigAcct,peopleSort:state.peopleSort}));}catch(e){}
}
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!d)return;
    if(d.ACCOUNTS&&d.ACCOUNTS.length){ACCOUNTS.length=0;d.ACCOUNTS.forEach(a=>ACCOUNTS.push(a));const ids=new Set(ACCOUNTS.map(a=>a.id));for(let k=EMAILS.length-1;k>=0;k--)if(!ids.has(EMAILS[k].account))EMAILS.splice(k,1);}
    Object.assign(PREFS,d.PREFS||{});Object.assign(SIGS,d.SIGS||{});
    if(d.STYLE_RULES)STYLE_RULES=d.STYLE_RULES;
    if(d.NOTES){NOTES=d.NOTES;nextNote=d.nextNote||NOTES.length+1;}
    if(d.DRAFTS){DRAFTS=d.DRAFTS;nextDraft=d.nextDraft||DRAFTS.length+1;}
    (d.DECISIONS||[]).forEach(x=>DECISIONS.push(x));
    Object.assign(GROUP_OVERRIDES,d.GROUP_OVERRIDES||{});Object.assign(AUTO_RULES,d.AUTO_RULES||{});(d.SORTED_SENDERS||[]).forEach(k=>SORTED_SENDERS.add(k));Object.entries(d.CUSTOM_ICONS||{}).forEach(([g,i])=>setGroupIcon(g,i));(d.CUSTOM_GROUPS||[]).forEach(g=>{if(!CUSTOM_GROUPS.includes(g))CUSTOM_GROUPS.push(g);});
    Object.assign(CONTACT_NOTES,d.CONTACT_NOTES||{});(d.CONTACT_PINS||[]).forEach(x=>CONTACT_PINS.add(x));
    if(d.openGroups)state.openGroups=d.openGroups;if(d.sigAcct)state.sigAcct=d.sigAcct;if(d.peopleSort)state.peopleSort=d.peopleSort;
    if(PREFS.theme&&PREFS.theme!=='auto')document.documentElement.setAttribute('data-theme',PREFS.theme);
  }catch(e){}
}
function resetState(){Store.wipe();try{localStorage.removeItem('sm-gmail');localStorage.removeItem(SAVE_KEY);localStorage.removeItem('sm-voice');localStorage.removeItem('sm-rate');localStorage.removeItem('sm-webllm');}catch(e){}location.reload();}
loadState();
let saveTimer=null;
const _renderAll=renderAll;
renderAll=function(){_renderAll();clearTimeout(saveTimer);saveTimer=setTimeout(saveState,400);};
window.addEventListener('beforeunload',saveState);
document.addEventListener('input',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveState,800);},true);
document.addEventListener('click',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveState,800);},true);

// Real accounts: never flash the demo. Show the last-seen inbox instantly while the full copy opens.
Gmail.load();
if(Gmail.on){EMAILS.length=0;Gmail.syncAccountsList();Gmail.loadingLocal=true;try{(JSON.parse(localStorage.getItem('sm-snap')||'[]')).forEach(e=>EMAILS.push(mk(e)));}catch(e){}}
renderAll();
document.addEventListener('pointerdown',()=>{if(Gmail.on)Gmail.gestureRefresh();},true);
document.addEventListener('keydown',()=>{if(Gmail.on)Gmail.gestureRefresh();},true);
// a gentle demo: one email arrives on its own shortly after load
Gmail.boot().then(live=>{if(live){const sf=$('simFloat');if(sf)sf.remove();}else{window.__demoTimer=setTimeout(simulateIncoming,14000);}});
</script>
