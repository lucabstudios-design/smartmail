<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#eef3fa"><link rel="manifest" href="manifest.webmanifest"><title>SmartMail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head><body><style>
/* Layout: frosted three-pane mail client (B1) — glass sidebar | list | reader; reply slides panes so the email docks left and compose opens beside it */
:root{
  --bg:#eef3fa;
  --bg-grad:linear-gradient(160deg,#f3f7fd 0%,#e9f1fb 45%,#eaf0f8 100%);
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.82);
  --stroke:rgba(120,140,170,.22);
  --ink:#1c1f26;
  --muted:#6b7585;
  --accent:#0a84ff;
  --accent-soft:rgba(10,132,255,.12);
  --badge:#ff3b30;
  --flag:#ff9f0a;
  --ok:#30b15c;
  --shadow:0 10px 30px rgba(40,60,100,.10);
  --radius:16px;
  --hi:.95;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317;
    --bg-grad:linear-gradient(160deg,#14181f 0%,#101420 45%,#0f1319 100%);
    --glass:rgba(28,32,40,.62);
    --glass-strong:rgba(32,37,47,.85);
    --stroke:rgba(140,160,190,.16);
    --ink:#e8ecf3;
    --muted:#8a94a6;
    --accent:#2b95ff;
    --accent-soft:rgba(43,149,255,.16);
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --hi:.38;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101317;
  --bg-grad:linear-gradient(160deg,#14181f 0%,#101420 45%,#0f1319 100%);
  --glass:rgba(28,32,40,.62);
  --glass-strong:rgba(32,37,47,.85);
  --stroke:rgba(140,160,190,.16);
  --ink:#e8ecf3;
  --muted:#8a94a6;
  --accent:#2b95ff;
  --accent-soft:rgba(43,149,255,.16);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --hi:.38;
  color-scheme:dark;
}
@property --tint{syntax:'<color>';inherits:true;initial-value:#0a84ff}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  background-image:var(--bg-grad);
  color:var(--ink);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,textarea{font:inherit;color:inherit}
svg{vertical-align:-2px;flex:none}
.app{display:flex;height:100%;padding:14px;gap:14px}
.pane{backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);background:var(--glass);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow)}
.app.replying .sidebar,.app.replying .listpane{display:none}
.app.replying .reader{flex:0 0 44%;min-width:280px}
.app.newmsg .reader{display:none}

/* ---------- Sidebar ---------- */
.app{position:relative}
.sidebar{width:270px;min-width:0;flex:none;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:visible;margin-right:0;
  transition:width .5s cubic-bezier(.32,.9,.3,1),margin .5s cubic-bezier(.32,.9,.3,1),opacity .35s ease}
.sidebar>*{width:270px;flex-shrink:0}
.sidebar>.side-main{flex:1 1 0}
.app.sb-collapsed .sidebar,.app.sb-anim .sidebar{overflow:hidden}
.app.sb-collapsed .sidebar{width:0;margin-right:-14px;opacity:0;pointer-events:none}
.side-top{flex:none;padding:14px 12px 12px}
.side-main{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.side-smart{flex:none;padding:4px 10px 6px;position:relative;isolation:isolate}
#smartItems{display:grid;grid-template-columns:1fr 1fr;gap:4px 5px}
#smartItems .side-label{grid-column:1/-1}
#smartItems .nav-item{padding:0 7px;gap:5px;font-size:12px;white-space:nowrap;min-width:0}
#smartItems .nav-item .nav-ico{flex:none}
#smartItems .nav-item .nav-ico svg{width:16px;height:16px}
.nav-lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
#smartItems .nav-item{position:relative;overflow:visible}
#smartItems .nav-item .badge,#smartItems .nav-item .nav-count{position:absolute;top:-5px;right:-3px;margin:0;flex:none;min-width:18px;height:18px;font-size:10.5px;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:2}
#smartItems .nav-item .nav-count{background:var(--glass-strong);border:1px solid var(--stroke);color:var(--muted)}
#smartItems .nav-item.active .nav-count{background:#fff;color:var(--accent);border-color:transparent}
#smartItems{padding:6px 2px 2px;overflow:visible}
.side-smart{overflow:visible}
.side-smart{padding:0 6px 6px}
#smartItems .nav-item .nav-count,#smartItems .nav-item .badge{margin-left:auto}
.groups-label{flex:none;margin-top:2px;padding:12px 18px 6px;border-top:1px solid var(--stroke)}
.side-head{padding:0}

/* sliding glass indicator (shared) */
.pill{position:absolute;left:0;top:0;width:0;height:0;border-radius:9px;pointer-events:none;z-index:0;opacity:0;
  transition:transform .55s cubic-bezier(.3,1.3,.45,1),width .45s cubic-bezier(.3,1,.4,1),height .45s cubic-bezier(.3,1,.4,1),opacity .3s ease,--tint .45s ease}
.pill.show{opacity:1}
.pill::before{content:"";position:absolute;inset:0 0 55% 0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.pill.solid{background:linear-gradient(180deg,#3d9bff 0%,#0a84ff 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 10px rgba(10,132,255,.25)}
.pill.liquid{border-radius:10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 20%,rgba(255,255,255,.75)),color-mix(in srgb,var(--tint) 12%,rgba(255,255,255,.55)));
  border:1px solid color-mix(in srgb,var(--tint) 22%,rgba(255,255,255,.7));
  backdrop-filter:blur(10px) saturate(1.5);-webkit-backdrop-filter:blur(10px) saturate(1.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,var(--hi)),0 2px 8px color-mix(in srgb,var(--tint) 16%,rgba(30,50,90,.08))}
.pill.liquid::before{display:none}
.pill.seg-pill{border-radius:8px}

/* logo -> Settings morph */
.logo-btn{position:relative;display:block;height:35px;width:138px;border-radius:12px;text-align:left;border:1px solid transparent;
  transition:width .55s cubic-bezier(.32,1.15,.4,1),background .3s,border-color .3s,box-shadow .4s}
.logo-btn:hover{background:var(--accent-soft)}
.logo-btn .lm{position:absolute;left:3px;top:3px;width:27px;height:27px;filter:drop-shadow(0 3px 7px rgba(10,132,255,.4));transition:opacity .25s,transform .5s cubic-bezier(.3,1.3,.4,1)}
.logo-btn .lm svg{width:100%;height:100%;display:block}
.logo-btn .l-ico{position:absolute;left:7px;top:8px;color:var(--accent);opacity:0;transform:scale(.4) rotate(-90deg);transition:opacity .25s,transform .55s cubic-bezier(.3,1.3,.4,1)}
.logo-btn .l-text,.logo-btn .l-set{position:absolute;left:39px;top:0;line-height:33px;white-space:nowrap;transition:opacity .25s ease,transform .5s cubic-bezier(.3,1,.4,1),filter .3s ease}
.logo-btn .l-text{font-weight:700;font-size:16px;letter-spacing:-.2px}
.logo-btn .l-set{font-weight:650;font-size:14.5px;color:var(--ink);opacity:0;transform:translateX(-12px);filter:blur(4px)}
.logo-btn .l-chev{pointer-events:none;position:absolute;right:5px;top:5px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:0;transform:translateX(-10px);transition:opacity .3s,transform .5s cubic-bezier(.3,1,.4,1)}
.logo-btn.expanded{width:calc(100% - 42px);background:var(--glass-strong);border-color:var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,var(--hi)),0 6px 16px rgba(10,80,180,.12)}
.logo-btn.expanded .l-text{opacity:0;transform:translateX(16px);filter:blur(4px)}
.logo-btn.expanded .lm{opacity:0;transform:scale(.4) rotate(80deg)}
.logo-btn.expanded .l-ico{opacity:1;transform:none}
.logo-btn.expanded .l-chev{pointer-events:auto}
.logo-btn.expanded .l-set,.logo-btn.expanded .l-chev{opacity:1;transform:none;filter:none;transition-delay:.12s}
.logo-btn .l-chev:hover{background:var(--accent-soft);color:var(--ink)}

.acct-switch{margin:10px 0 0;position:relative;isolation:isolate}
.acct-items{display:flex;flex-direction:column;gap:2px}
.acct{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:9px;font-size:11.5px;color:var(--muted);width:100%;text-align:left;transition:color .3s,background .25s}
.acct.active{color:var(--ink);font-weight:650}
.acct:not(.active):hover{background:var(--accent-soft)}
.acct-dot{width:8px;height:8px;border-radius:50%;flex:none;transition:transform .4s cubic-bezier(.3,1.5,.4,1),box-shadow .3s}
.acct.active .acct-dot{transform:scale(1.25);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.acct .addr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-scroll{flex:1;overflow-y:auto;padding:4px 10px 14px;min-height:0}
.grp-wrap{position:relative;isolation:isolate}
.side-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px}
.nav-item{position:relative;z-index:1;display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;border-radius:9px;font-size:13.5px;font-weight:500;transition:color .3s,background .25s}
.nav-item .nav-ico{color:var(--muted);display:inline-flex;transition:color .3s,transform .4s cubic-bezier(.3,1.5,.4,1)}
.nav-item:not(.active):hover{background:var(--accent-soft)}
.nav-item:not(.active):active{transform:scale(.985)}
.nav-item.active{color:#fff}
.nav-item.active .nav-ico{color:#fff;transform:scale(1.1)}
.nav-item.active .nav-count{background:rgba(255,255,255,.25);color:#fff}
.nav-count{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;border-radius:20px;padding:0 5px;transition:color .3s,background .3s}
.badge{margin-left:auto;background:var(--badge);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(255,59,48,.4)}
.grp-senders{margin:2px 0 4px 26px;display:flex;flex-direction:column;gap:1px}
.grp-senders.unfold{animation:unfold .4s cubic-bezier(.2,.9,.3,1) both;transform-origin:top}
@keyframes unfold{from{opacity:0;transform:translateY(-6px) scaleY(.9)}to{opacity:1;transform:none}}
.sender-row{position:relative;z-index:1;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:8px;font-size:12.5px;color:var(--muted);transition:color .3s,background .25s}
.sender-row:not(.active):hover{background:var(--accent-soft);color:var(--ink)}
.sender-row.active{color:#fff;font-weight:600}
.s-avatar{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.caret{margin-left:auto;font-size:9px;color:var(--muted);transition:transform .3s cubic-bezier(.3,1.4,.4,1),color .3s}
.nav-item.active .caret{color:rgba(255,255,255,.8)}
.caret.open{transform:rotate(90deg)}
.nav-item .badge+.caret{margin-left:6px}

/* collapse buttons */
.side-top{position:relative}
.sb-btn{position:absolute;top:14px;right:12px;width:35px;height:35px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:background .25s,color .25s,opacity .3s}
.sb-btn:hover{background:var(--accent-soft);color:var(--accent)}
.sb-open{display:none;width:36px;height:36px;border-radius:12px;place-items:center;color:var(--muted);flex:none;margin-right:2px;transition:background .25s,color .25s,transform .4s var(--fluid)}
.sb-open:hover{background:var(--subtle);color:var(--accent)}
.app.sb-collapsed .sb-open{display:grid;animation:itemIn .35s var(--ease) both}
.app.replying .sb-open,.app.newmsg .sb-open{display:none}

/* floating simulate tab (prototype only) */
.sim-float{position:fixed;left:0;top:0;z-index:85;width:36px;padding:12px 0 14px;display:flex;flex-direction:column;align-items:center;gap:9px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  background:var(--glass-strong);border:1px solid var(--stroke);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,var(--hi));color:var(--accent);
  transition:transform .5s cubic-bezier(.3,1.25,.4,1),box-shadow .25s,border-radius .3s}
.sim-float[data-side="l"]{border-radius:0 14px 14px 0;border-left:none}
.sim-float[data-side="r"]{border-radius:14px 0 0 14px;border-right:none}
.sim-float span{writing-mode:vertical-rl;font-size:11.5px;font-weight:650;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.sim-float:hover span{color:var(--accent)}
.sim-float.dragging{transition:box-shadow .25s;cursor:grabbing;border-radius:14px;border:1px solid var(--stroke);box-shadow:0 18px 40px rgba(20,40,90,.28),inset 0 1px 0 rgba(255,255,255,var(--hi))}
.sim-float.pressed{filter:brightness(.96)}

/* settings page */
.settingspane{display:none;flex:1;min-width:0;flex-direction:column;overflow:hidden}
.app.settings .listpane,.app.settings .reader,.app.settings .composepane,.app.sigedit .listpane,.app.sigedit .reader,.app.sigedit .composepane,.app.sigedit .settingspane:not(.sigpane){display:none}
.app.sigedit .sigpane{display:flex;animation:paneIn .45s cubic-bezier(.2,.9,.3,1) both}
.app.sigedit .sidebar,.app.sigedit .sb-open{display:none}
.app.sigedit .settingspane:not(.sigpane){display:none!important}
.app.settings .settingspane:not(.sigpane){display:flex;animation:paneIn .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes paneIn{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
.set-head{display:flex;align-items:center;gap:10px;padding:16px 22px 12px;border-bottom:1px solid var(--stroke)}
.set-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px;flex:1}
.set-body{flex:1;overflow-y:auto;padding:18px 22px 28px;min-height:0}
.set-inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.set-card{background:var(--glass-strong);border:1px solid var(--stroke);border-radius:16px;overflow:hidden}
.set-card h3{margin:0;padding:13px 16px 4px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.set-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--stroke);min-height:46px}
.set-card h3+.set-row{border-top:none}
.set-row .sr-main{flex:1;min-width:0}
.set-row .sr-title{font-size:13.5px;font-weight:550}
.set-row .sr-sub{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.4}
.sw{position:relative;width:42px;height:25px;border-radius:20px;background:rgba(120,130,150,.35);flex:none;transition:background .3s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.3,1.4,.4,1)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(17px)}
.set-acct-dot{width:10px;height:10px;border-radius:50%;flex:none}
.set-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:7px 13px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke);color:var(--accent);flex:none}
.set-btn:hover{border-color:var(--accent)}
.set-btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(10,132,255,.3)}
.add-acct{display:none;gap:8px;padding:12px 16px;border-top:1px solid var(--stroke);align-items:center}
.add-acct.open{display:flex}
.add-acct input{flex:1;min-width:0;background:var(--glass);border:1px solid var(--stroke);border-radius:10px;padding:8px 12px;outline:none;font-size:13px}
.set-seg{display:flex;background:var(--glass);border:1px solid var(--stroke);border-radius:10px;padding:2px;gap:2px;flex:none}
.set-seg button{font-size:12px;font-weight:600;color:var(--muted);padding:4px 12px;border-radius:8px;transition:background .25s,color .25s}
.set-seg button.on{background:var(--accent);color:#fff}
.set-note{font-size:12px;color:var(--muted);line-height:1.5;padding:2px 4px}
.rule-list{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 13px}
@media (prefers-reduced-motion: reduce){
  .sidebar,.pill,.logo-btn,.logo-btn *,.sb-tab,.sim-float,.acct-dot,.sw::after,.grp-senders.unfold,.app.settings .settingspane,.enter>*{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}
}
/* ---------- List pane ---------- */
.listpane{width:360px;min-width:300px;display:flex;flex-direction:column;overflow:hidden}
.list-head{padding:14px 16px 10px;border-bottom:1px solid var(--stroke)}
.list-title-row{display:flex;align-items:center;gap:8px}
.menu-btn{display:none;font-size:18px;padding:4px 8px;border-radius:8px}
.list-title{font-size:17px;font-weight:700;letter-spacing:-.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.triage-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#4aa8ff,#0a84ff);color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;box-shadow:0 4px 12px rgba(10,132,255,.35);flex:none}
.triage-btn:hover{filter:brightness(1.07)}
.new-btn{display:inline-flex;align-items:center;gap:6px;background:var(--glass-strong);border:1px solid var(--stroke);color:var(--accent);font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;flex:none}
.new-btn:hover{border-color:var(--accent)}
.searchbar{margin-top:10px;display:flex;align-items:center;gap:7px;background:var(--glass-strong);border:1px solid var(--stroke);border-radius:10px;padding:6px 10px;color:var(--muted)}
.searchbar input{border:none;background:none;outline:none;flex:1;font-size:13px;min-width:0;color:var(--ink)}
.gist-toggle{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);padding:3px 8px;border-radius:8px;flex:none}
.gist-toggle.on{color:var(--accent);background:var(--accent-soft)}
.seg{position:relative;isolation:isolate;margin-top:9px;display:flex;background:var(--glass-strong);border:1px solid var(--stroke);border-radius:10px;padding:2px}
.seg-items{display:flex;gap:2px;flex:1}
.seg button{position:relative;z-index:1;flex:1;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:8px;transition:color .3s}
.seg button.on{color:#fff}
.enter>*{animation:itemIn .42s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0)*24ms)}
.enter>*:nth-child(n+13){animation:none}
@keyframes itemIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.list-scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding:8px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.mail-item{width:100%;text-align:left;display:flex;gap:10px;padding:11px 10px;border-radius:12px;position:relative;border:1px solid transparent}
.mail-item:hover{background:var(--glass-strong);border-color:var(--stroke)}
.mail-item.sel{background:var(--accent-soft);border-color:rgba(10,132,255,.3)}
.m-avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.m-main{flex:1;min-width:0}
.m-top{display:flex;align-items:baseline;gap:6px;min-width:0}
.m-from{font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-count{font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--subtle);color:var(--muted);display:inline-grid;place-items:center;flex:none}
.m-you{font-size:11px;font-weight:500;color:var(--muted)}
.m-time{margin-left:auto;font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.m-subj{display:block;font-size:13px;font-weight:500;overflow:hidden;margin-top:1px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.m-snip{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.m-meta{display:flex;gap:5px;margin-top:5px;align-items:center;flex-wrap:wrap}
.chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.chip.reply{background:rgba(255,159,10,.15);color:var(--flag)}
.gist-btn{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;border:1px dashed var(--stroke);color:var(--muted)}
.gist-btn:hover{color:var(--accent);border-color:var(--accent)}
.m-gistline{font-size:11.5px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px;flex-basis:100%}
.m-meta .spacer{flex:1}
.qa{display:inline-flex;align-items:center;color:var(--muted);padding:2px 5px;border-radius:6px;opacity:.7}
.qa:hover{opacity:1;color:var(--accent);background:var(--accent-soft)}
.qa.on{color:var(--flag);opacity:1}
.unread-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);position:absolute;left:2px;top:50%;transform:translateY(-50%);box-shadow:0 0 6px rgba(10,132,255,.6)}
.mail-item.read .m-from,.mail-item.read .m-subj{font-weight:450;color:var(--muted)}

/* ---------- Reader + compose panes ---------- */
.reader{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;min-width:0;scrollbar-gutter:stable}
.reader-empty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px;line-height:1.7}
.r-head{padding:16px 20px 12px;border-bottom:1px solid var(--stroke);flex:none}
.r-toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.r-subject{font-size:19px;font-weight:700;letter-spacing:-.3px;flex:1 1 100%;text-wrap:balance;margin:0 0 6px}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--stroke);color:var(--muted)}
.tool:hover{color:var(--accent);border-color:var(--accent)}
.tool.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(10,132,255,.3)}
.tool.primary:hover{color:#fff;filter:brightness(1.07)}
.tool.flagged{background:rgba(255,159,10,.15);color:var(--flag);border-color:rgba(255,159,10,.4)}
.back-btn{display:none}
.r-fromrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.r-frommeta{min-width:0}
.r-fromname{font-weight:650;font-size:13.5px}
.r-fromaddr{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-date{margin-left:auto;font-size:12px;color:var(--muted);flex:none}
.r-body{flex:none;overflow:visible;padding:20px 24px;line-height:1.65;font-size:14px}
.r-body p{max-width:62ch;margin:0 0 14px}
.gist-strip{margin:0 20px;margin-top:12px;background:var(--accent-soft);border:1px solid rgba(10,132,255,.25);border-radius:12px;padding:9px 13px;font-size:13px;display:flex;gap:8px;align-items:center;color:var(--ink)}
.gist-strip b{color:var(--accent)}
.state-strip{margin:0 20px;margin-top:12px;border-radius:12px;padding:9px 13px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.state-strip.done{background:rgba(48,177,92,.12);border:1px solid rgba(48,177,92,.3);color:var(--ok)}
.state-strip.junk{background:rgba(255,59,48,.08);border:1px solid rgba(255,59,48,.25);color:var(--badge)}
.state-strip.spam{background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.3);color:#b96a00}
.state-strip.bin{background:var(--subtle);border:1px solid var(--hair);color:var(--muted)}

.composepane{flex:1.2;min-width:0;display:flex;flex-direction:column;overflow:hidden;animation:paneIn .45s var(--ease) both}
.c-titlebar{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--stroke)}
.c-titlebar h3{margin:0;font-size:13.5px;font-weight:650;flex:1}
.c-fields{padding:8px 18px 0}
.c-field{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--stroke);padding:7px 0;font-size:13px}
.c-field label{color:var(--muted);width:52px;flex:none;font-size:12px}
.from-pick{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;color:var(--ink);padding:4px 10px 4px 8px;border-radius:999px;background:var(--subtle);transition:background .2s}
.from-pick:not([disabled]):hover{background:var(--accent-soft)}
.from-pick[disabled]{cursor:default}
.c-field input,.c-field select{border:none;background:none;outline:none;flex:1;min-width:0;font:inherit;color:inherit}
.c-body{flex:1;margin:8px 18px;border:none;background:none;outline:none;font-size:13.5px;line-height:1.6;min-height:60px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.c-body:empty::before{content:attr(data-placeholder);color:var(--muted)}
.c-body a{color:var(--accent)}
.ai-bar{border-top:1px solid var(--stroke);padding:12px 18px;display:flex;flex-direction:column;gap:9px;background:var(--accent-soft)}
.ai-row{display:flex;gap:8px}
.ai-row input{flex:1;min-width:0;background:var(--glass-strong);border:1px solid var(--stroke);border-radius:10px;padding:8px 12px;outline:none;font-size:13px}
.ai-gen{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#4aa8ff,#0a84ff);color:#fff;font-weight:700;font-size:12.5px;padding:8px 15px;border-radius:10px;flex:none;box-shadow:0 3px 10px rgba(10,132,255,.35)}
.ai-gen:hover{filter:brightness(1.07)}
.rules-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rules-row .rl{font-size:10.5px;font-weight:600;color:var(--muted)}
.rule-chip{font-size:11px;font-weight:600;background:var(--glass-strong);border:1px solid var(--stroke);border-radius:20px;padding:3px 9px;display:inline-flex;gap:6px;align-items:center}
.rule-chip button{color:var(--muted);font-size:11px;line-height:1}
.rule-chip button:hover{color:var(--badge)}
.add-rule{font-size:11px;font-weight:600;color:var(--accent)}
.c-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--stroke);align-items:center}
.send-btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:9px 20px;border-radius:20px;box-shadow:0 4px 12px rgba(10,132,255,.35)}
.send-btn:hover{filter:brightness(1.07)}
.c-foot .note{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}

/* ---------- Gist popover + menus ---------- */
.gist-pop{position:fixed;z-index:60;max-width:240px;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke);border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.45}
.gist-pop .gp-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.pop-menu{position:fixed;z-index:60;min-width:190px;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.pop-menu .gp-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:5px 10px 4px}
.pop-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px}
.pop-menu button:hover{background:var(--accent-soft)}
.pop-menu .cur{margin-left:auto;color:var(--accent);font-weight:700}
.pop-menu input{width:100%;background:var(--glass);border:1px solid var(--stroke);border-radius:8px;padding:6px 9px;font-size:12.5px;outline:none}

/* ---------- Toasts ---------- */
.toasts{position:fixed;bottom:22px;left:22px;z-index:90;display:flex;flex-direction:column-reverse;gap:9px;max-width:min(340px,calc(100vw - 32px))}
.toast{background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;animation:slidein .3s ease;cursor:pointer}
@keyframes slidein{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}.card{transition:none!important}}
.toast .t-ico{color:var(--accent);display:inline-flex;padding-top:1px}
.toast .t-title{font-weight:650;font-size:13px}
.toast .t-sub{font-size:12px;color:var(--muted);margin-top:2px}
.toast .t-gist{font-size:11.5px;color:var(--accent);margin-top:3px;font-weight:600}
.undo-card{align-items:center;padding:12px 14px;min-width:300px}
.ring{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--subtle);stroke-width:3}
.ring .arc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .num{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.toast .t-act{align-self:center;flex:none;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:6px 12px;box-shadow:0 6px 14px -6px rgba(10,132,255,.9)}
.toast .t-act:hover{filter:brightness(1.07)}

/* ---------- Triage overlay ---------- */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(20,30,50,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.triage-box{width:min(540px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
.triage-head{color:#fff;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.triage-head h2{margin:0;font-size:19px}
.triage-head p{margin:4px 0 0;font-size:12.5px;opacity:.85}
.deck{position:relative;width:min(430px,100%);height:330px}
.card{position:absolute;inset:0;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--stroke);border-radius:20px;padding:20px;box-shadow:0 16px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .25s ease,opacity .25s ease}
.card.dragging{transition:none;cursor:grabbing}
.card .c-from{display:flex;align-items:center;gap:10px}
.card .c-subj{font-size:16px;font-weight:700;text-wrap:balance}
.card .c-gist{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:3px 9px;border-radius:20px}
.card .c-snip{font-size:13px;color:var(--muted);line-height:1.55;overflow:hidden;flex:1}
.stamp{position:absolute;top:18px;font-size:15px;font-weight:800;letter-spacing:.06em;padding:5px 12px;border-radius:10px;border:2.5px solid;opacity:0;transform:rotate(-8deg)}
.stamp.keep{right:18px;color:var(--ok);border-color:var(--ok)}
.stamp.hide{left:18px;color:var(--badge);border-color:var(--badge)}
.stamp.leave{left:50%;bottom:18px;top:auto;translate:-50% 0;transform:rotate(0);color:var(--muted);border-color:var(--muted)}
.stamp.reply{left:50%;translate:-50% 0;transform:rotate(0);color:var(--flag);border-color:var(--flag)}
.triage-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:520px}
.triage-sugg{color:#fff;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:999px;backdrop-filter:blur(10px)}
.triage-sugg b{font-weight:700}
.t-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:650;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.88);color:var(--ink,#1c1f26);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 24px -12px rgba(0,0,0,.4);transition:transform .25s var(--fluid),background .2s}
.t-btn:hover{transform:translateY(-2px)}
.t-btn.keep{background:var(--accent);color:#fff;border-color:transparent}
.t-btn.leave{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35)}
.t-btn.leave svg{transform:rotate(90deg)}
.t-act{width:58px;height:58px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--stroke);box-shadow:var(--shadow);display:grid;place-items:center}
.t-act:hover{transform:scale(1.08)}
.t-act.hide{color:var(--badge)}.t-act.keep{color:var(--ok)}.t-act.reply{color:var(--flag);width:48px;height:48px}
.triage-hint{color:#fff;font-size:11.5px;opacity:.8;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.close-x{position:fixed;top:16px;right:16px;color:#fff;font-size:15px;font-weight:700;background:rgba(255,255,255,.18);border-radius:20px;padding:7px 14px;backdrop-filter:blur(10px)}

/* ---------- Notes view ---------- */
.notes-wrap{padding:8px 4px}
.note-add{display:flex;gap:8px;margin-bottom:14px}
.note-add input{flex:1;min-width:0;background:var(--glass-strong);border:1px solid var(--stroke);border-radius:12px;padding:10px 14px;outline:none;font-size:13.5px}
.note-add button{background:var(--accent);color:#fff;font-weight:700;font-size:12.5px;padding:0 16px;border-radius:12px}
.note-card{background:var(--glass-strong);border:1px solid var(--stroke);border-radius:14px;padding:13px 15px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.note-text{font-size:13.5px;line-height:1.5}
.note-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note-link{display:inline-flex;gap:7px;align-items:center;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:20px}
.note-link:hover{filter:brightness(1.05)}
.note-acct{font-size:10px;font-weight:700;color:var(--muted);background:var(--glass);border:1px solid var(--stroke);border-radius:20px;padding:2px 8px}
.note-del{font-size:11px;color:var(--muted);margin-left:auto}
.note-del:hover{color:var(--badge)}
.note-date{font-size:11px;color:var(--muted)}

/* ---------- Design language v2: clear glass, big soft tiles, one fluid ease ---------- */
:root{
  --ease:cubic-bezier(.22,1,.36,1);
  --fluid:cubic-bezier(.32,.72,0,1);
  --radius:22px;
  --font-display:'Inter Tight','Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  --ink2:#3d4452;
  --glass:rgba(255,255,255,.5);
  --glass-strong:rgba(255,255,255,.72);
  --stroke:rgba(255,255,255,.85);
  --hair:rgba(20,40,80,.08);
  --subtle:rgba(20,40,80,.045);
  --shadow:0 1px 2px rgba(10,30,60,.04),0 30px 60px -30px rgba(20,60,120,.28);
  --shadow-raised:0 1px 2px rgba(10,30,60,.05),0 40px 80px -30px rgba(20,60,120,.38);
  --accent-rgb:10,132,255;
  --bg-grad:radial-gradient(900px 560px at 8% 6%, rgba(120,190,255,.45), transparent 60%),radial-gradient(760px 520px at 96% 12%, rgba(190,215,255,.5), transparent 60%),radial-gradient(900px 620px at 50% 112%, rgba(150,205,255,.42), transparent 60%),#eef3fa;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink2:rgba(255,255,255,.66);
    --glass:rgba(255,255,255,.055);--glass-strong:rgba(255,255,255,.09);
    --stroke:rgba(255,255,255,.12);--hair:rgba(255,255,255,.09);--subtle:rgba(255,255,255,.06);
    --shadow:0 24px 60px -30px rgba(0,0,0,.8);--shadow-raised:0 40px 90px -30px rgba(0,0,0,.9);
    --bg-grad:radial-gradient(900px 600px at 12% 0%, rgba(43,149,255,.2), transparent 55%),radial-gradient(700px 500px at 100% 100%, rgba(80,120,255,.12), transparent 55%),linear-gradient(160deg,#131518 0%,#0a0b0d 100%);
  }
}
:root[data-theme="dark"]{
  --ink2:rgba(255,255,255,.66);
  --glass:rgba(255,255,255,.055);--glass-strong:rgba(255,255,255,.09);
  --stroke:rgba(255,255,255,.12);--hair:rgba(255,255,255,.09);--subtle:rgba(255,255,255,.06);
  --shadow:0 24px 60px -30px rgba(0,0,0,.8);--shadow-raised:0 40px 90px -30px rgba(0,0,0,.9);
  --bg-grad:radial-gradient(900px 600px at 12% 0%, rgba(43,149,255,.2), transparent 55%),radial-gradient(700px 500px at 100% 100%, rgba(80,120,255,.12), transparent 55%),linear-gradient(160deg,#131518 0%,#0a0b0d 100%);
}
body{font-family:var(--font-body);font-feature-settings:"cv11","ss01","tnum";font-size:14px}
h1,h2,h3,.list-title,.r-subject,.set-head h2,.logo-btn .l-text,.logo-btn .l-set,.triage-head h2{font-family:var(--font-display);letter-spacing:-.025em}
.app{padding:16px;gap:16px}
.pane{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5)}
:root[data-theme="dark"] .pane{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pane{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)}}
.list-head,.groups-label,.r-head,.c-titlebar,.c-foot,.ai-bar,.set-head,.set-row,.c-field{border-color:var(--hair)}
.sidebar{gap:14px}
.side-top{padding:16px 14px 8px}
.side-smart{padding:0 12px 6px}
.side-smart .nav-item{height:36px;font-size:13.5px}
.side-smart .nav-item+.nav-item{margin-top:1px}
.side-smart .side-label{padding:9px 12px 4px}
.side-scroll{padding:0 12px 12px}
#grpItems>.nav-item+.nav-item,#grpItems>.grp-senders+.nav-item{margin-top:2px}
.groups-label{padding:8px 20px 2px;margin-top:0}
.side-label{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);padding:14px 12px 8px}

/* the sliding highlight: clear glass for accounts, solid accent lit from below for the current mailbox */
.pill{border-radius:14px;transition:transform .6s var(--fluid),width .5s var(--fluid),height .5s var(--fluid),opacity .3s ease,--tint .45s ease}
.pill::before{display:none}
.pill.solid{background:var(--accent);box-shadow:0 10px 26px -8px rgba(var(--accent-rgb),.85)}
.pill.liquid{border-radius:12px;border:1px solid rgba(255,255,255,.9);
  background:linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.5) 100%);
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.25),0 12px 32px -14px rgba(20,60,120,.35);
  backdrop-filter:blur(36px) saturate(1.8);-webkit-backdrop-filter:blur(36px) saturate(1.8)}
.pill.liquid::after{display:none}
:root[data-theme="dark"] .pill.liquid{background:linear-gradient(180deg,rgba(40,40,44,.72),rgba(24,24,28,.6));border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 40px -16px rgba(0,0,0,.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.liquid{background:linear-gradient(180deg,rgba(40,40,44,.72),rgba(24,24,28,.6));border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 40px -16px rgba(0,0,0,.9)}}
.pill.seg-pill{border-radius:10px}

/* hover: a clear-glass tile grows out from the left, like the rail */
.nav-item,.acct,.sender-row{isolation:isolate;overflow:visible;transition:color .25s var(--ease)}
.nav-item::before,.acct::before,.sender-row::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;opacity:0;transform:scale(.92);transform-origin:left center;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.9);
  box-shadow:inset 0 1px 0 #fff,0 12px 32px -14px rgba(20,60,120,.3);
  transition:opacity .3s var(--ease),transform .55s var(--fluid)}

.seg-items{width:100%}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg-n{font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--subtle);color:var(--muted);display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;transition:background .3s,color .3s}
.seg button.on .seg-n{background:rgba(255,255,255,.25);color:#fff}
.app:not(.list-full):not(.notes-full) .seg button .seg-n{display:none}
.app:not(.list-full):not(.notes-full) .seg button{gap:4px;font-size:11.5px}
.r-close{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--stroke);color:var(--ink2);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);transition:transform .3s var(--fluid),color .2s;flex:none}
.r-close:hover{color:var(--ink);transform:rotate(90deg)}
.app.replying .r-close{display:none}
@media (max-width:1000px){.r-close{display:none}}

/* smart placement suggestion */
.mail-item{cursor:pointer;font:inherit;color:inherit}
.sugg{display:inline-flex;align-items:center;gap:5px;padding:3px 4px 3px 7px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink);background:var(--glass-strong);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);max-width:100%;transition:transform .25s var(--fluid),opacity .25s}
.sugg.going{transform:scale(.9);opacity:0}
.sugg .sg-ico{display:inline-flex;color:var(--accent)}
.sugg.conf-hi .sg-ico{color:var(--ok)}
.sugg.conf-lo .sg-ico{color:var(--flag)}
.sugg .sg-text{display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .sg-pct{font-size:10.5px;color:var(--muted);font-weight:600}
.sugg .sg-sel{appearance:none;-webkit-appearance:none;font:inherit;font-size:11px;font-weight:600;color:var(--ink2);background:var(--subtle);border:none;border-radius:999px;padding:3px 20px 3px 9px;outline:none;cursor:pointer;max-width:120px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236b7585' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 7px center}
.sugg .sg-sel:hover{color:var(--ink)}
.sugg .sg-ok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;cursor:pointer;flex:none;box-shadow:0 6px 14px -6px rgba(var(--accent-rgb),.9);transition:transform .25s var(--fluid)}
.sugg .sg-ok:hover{transform:scale(1.1)}
.m-sugg{display:flex;margin-top:7px}
.sugg.compact{margin-top:0;padding-left:7px;gap:5px}
.sugg .sg-sel{color:var(--ink);font-weight:650;max-width:170px}
.sugg.compact .sg-sel{color:var(--ink);font-weight:650;max-width:150px}
.sugg .sg-text{order:3}
.sugg .sg-ok{order:4}
.sugg.compact .sg-sel{max-width:120px;padding:3px 20px 3px 9px;opacity:1}

.sugg-strip{margin:12px 20px 0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);border:1px solid rgba(10,132,255,.2);display:flex;flex-direction:column;gap:8px}
.sugg-strip .sugg{align-self:flex-start;font-size:12.5px;padding:5px 5px 5px 12px}
.sugg-strip .sg-sel{font-size:12px}
.sg-why{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.sg-why span::before{content:"·";margin-right:6px;color:var(--accent)}

/* hover tips */
.tip{position:fixed;z-index:120;max-width:260px;padding:9px 12px;border-radius:12px;background:rgba(28,31,38,.94);color:#fff;font-size:12px;line-height:1.45;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);pointer-events:none;opacity:0;transform:translateY(4px) scale(.98);transition:opacity .18s ease,transform .25s var(--fluid)}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-weight:650;font-size:12.5px;margin-bottom:2px}
.tip .tk{display:inline-block;margin-top:5px;font-size:10.5px;color:rgba(255,255,255,.6)}

.draft-ask{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--hair);background:var(--accent-soft);font-size:13px;font-weight:600;animation:itemIn .3s var(--ease) both}
.draft-ask span{flex:1}
.mail-item.draft .m-avatar{color:#fff}

/* conversation threads */
.thread-note{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:999px}
.r-body.thread{display:flex;flex-direction:column;gap:10px;padding:16px 20px 24px;flex:none}
.tmsg{border:1px solid var(--stroke);border-radius:16px;background:var(--glass-strong);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden;transition:box-shadow .25s}
.tmsg.me{background:var(--accent-soft);border-color:rgba(10,132,255,.18)}
.tmsg-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.tmsg-head .m-avatar{width:32px;height:32px;font-size:12.5px}
.tmsg-head .r-frommeta{min-width:0;flex:0 1 auto}
.tmsg-prev{flex:1;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmsg.open .tmsg-prev{display:none}
.tmsg.open .r-frommeta{flex:1}
.tmsg-body{display:none;padding:0 16px 16px 56px;line-height:1.65;font-size:14px}
.tmsg-body p{max-width:62ch;margin:0 0 12px}
.tmsg.open .tmsg-body{display:block}
.tmsg:not(.open):hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 24px -14px rgba(20,60,120,.3)}

/* after-send placement sheet */
.ask-sheet{position:fixed;left:0;right:0;bottom:22px;z-index:95;display:flex;justify-content:center;padding:0 16px;animation:askIn .45s var(--ease) both;pointer-events:none}
.ask-sheet.out{animation:askOut .25s var(--ease) both}
@keyframes askIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes askOut{to{opacity:0;transform:translateY(16px)}}
.ask-card{pointer-events:auto;max-width:640px;width:100%;background:var(--glass-strong);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--stroke);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow-raised),inset 0 1px 0 rgba(255,255,255,.9)}
.ask-title{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.ask-sub{font-size:12.5px;color:var(--muted);margin:4px 0 12px;line-height:1.45}
.ask-opts{display:flex;gap:8px;flex-wrap:wrap}
.ask-opts .t-btn{background:var(--subtle);border-color:transparent;box-shadow:none;color:var(--ink)}
.ask-opts .t-btn.keep{background:var(--accent);color:#fff;box-shadow:0 10px 26px -8px rgba(var(--accent-rgb),.85)}
.ask-rec{font-size:10.5px;font-weight:600;opacity:.8;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:999px}

/* list rows as glass cards (layout 04) */
.list-scroll{padding:6px 8px 12px}
.list-scroll>.mail-item+.mail-item{margin-top:8px}
.mail-item{padding:12px 12px 10px 14px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 32px -20px rgba(20,60,120,.3);transition:transform .3s var(--fluid),box-shadow .3s var(--fluid),background .25s}
.mail-item:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 20px 40px -20px rgba(20,60,120,.4);border-color:var(--stroke);background:var(--glass-strong)}
.mail-item.sel{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 10px 26px -8px rgba(var(--accent-rgb),.85)}
.mail-item.sel .m-from,.mail-item.sel .m-subj,.mail-item.sel .m-snip,.mail-item.sel .m-time,.mail-item.sel .m-gistline,.mail-item.sel .m-you,.mail-item.sel .qa{color:#fff}
.mail-item.sel .chip{background:rgba(255,255,255,.22);color:#fff}.mail-item.sel .chip.reply{background:rgba(255,255,255,.22);color:#fff}
.mail-item.sel .m-count{background:rgba(255,255,255,.22);color:#fff}
.mail-item.sel .qa{opacity:.85}.mail-item.sel .qa:hover{background:rgba(255,255,255,.2);color:#fff}
.mail-item.sel .unread-dot{background:#fff;box-shadow:none}
.mail-item.sel .note-acct{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.unread-dot{left:5px}
.mail-item.read .m-from,.mail-item.read .m-subj{font-weight:450;color:var(--muted)}
.m-sugg{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.qa-group{display:inline-flex;gap:2px;margin-left:auto}
.mail-item.sel .sugg{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);box-shadow:none}
.mail-item.sel .sg-ok{background:#fff;color:var(--accent);box-shadow:none}
.mail-item.sel .sg-ico{color:#fff}
.m-sugg .sugg{margin:0}
.m-sugg .spacer{flex:1}
.m-sugg .qa{margin-left:0}
.app.list-full .list-scroll{padding:8px 12px}
.app.list-full .mail-item{padding:12px 14px 10px 16px}

/* people */
.p-click{cursor:pointer}
.p-click:hover{filter:brightness(1.08)}
.r-fromname.p-click:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.p-hero{display:flex;gap:16px;align-items:center}
.p-avatar{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;flex:none;box-shadow:0 14px 30px -14px rgba(20,60,120,.5)}
.p-name{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.025em}
.p-email{color:var(--muted);font-size:13.5px;margin-top:2px}
.p-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.p-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.p-stats div{background:var(--subtle);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.p-stats b{font-family:var(--font-display);font-size:18px;font-weight:600}
.p-stats span{font-size:11px;color:var(--muted)}
.p-actions{display:flex;gap:8px;flex-wrap:wrap}
.p-note{width:100%;min-height:70px;border:1px solid var(--stroke);background:var(--glass-strong);border-radius:14px;padding:10px 12px;font:inherit;font-size:13.5px;resize:vertical;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.p-recent{display:flex;flex-direction:column;gap:4px}
.p-row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:12px;font-size:13px;transition:background .2s}
.p-row:hover{background:var(--subtle)}
.to-suggest button{align-items:center}
.mail-item.person .m-subj{color:var(--muted);font-weight:400}
.v-voice{max-width:240px;font:inherit;font-size:12px;color:var(--ink2);background:var(--subtle);border:1px solid transparent;border-radius:999px;padding:6px 10px;outline:none}
.set-btn.on,.ai-talk.on{background:var(--badge);color:#fff;border-color:transparent}

/* formatting bar, attachments, signature */
.fmt-bar{display:flex;align-items:center;gap:3px;padding:6px 14px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.fmt-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:28px;height:28px;padding:0 7px;border-radius:8px;font-size:13px;color:var(--ink2);transition:background .2s,color .2s;cursor:pointer}
.fmt-btn:hover{background:var(--subtle);color:var(--ink)}
.fmt-sel{font:inherit;font-size:12px;color:var(--ink2);background:var(--subtle);border:none;border-radius:8px;padding:5px 8px;outline:none;max-width:90px}
.fmt-color{position:relative}.fmt-color input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fmt-a{border-bottom:3px solid currentColor;line-height:1;font-weight:700}.fmt-hl{background:#fff3a3;padding:0 3px;border-radius:3px;font-weight:700;line-height:1.2}
.fmt-bar .spacer{flex:1}
.attach-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px;align-items:center}
.attach-row:empty{display:none}
.att-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 8px 5px 10px;border-radius:999px;background:var(--subtle)}
.att-chip.bad,.att-total.bad{color:var(--badge)}
.att-size{color:var(--muted);font-weight:500}
.att-chip button{color:var(--muted);font-size:11px}
.att-total{font-size:11.5px;color:var(--muted);margin-left:4px}
.sig-block{margin:6px 18px 10px;padding:12px 14px;border-radius:14px;background:var(--subtle);position:relative;font-size:13px;line-height:1.5}
.sig-block .sig-x{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.sig-block .sig-x:hover{background:rgba(255,59,48,.12);color:var(--badge)}
.sig-tag{position:absolute;top:-8px;left:12px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--glass-strong);padding:1px 7px;border-radius:999px;border:1px solid var(--stroke)}
.sig-render{font-family:var(--sigfont,Inter),sans-serif}
.sig-render .sg-name{font-weight:700;font-size:15px;color:var(--sigaccent,#0a84ff)}
.sig-render .sg-title{color:#555}
.sig-render .sg-line{color:#555}
.sig-render a{color:var(--sigaccent,#0a84ff);text-decoration:none}
.sig-render.inline .sg-line{display:inline}.sig-render.inline .sg-line+.sg-line::before{content:" · ";color:#aaa}
.sig-render.rule{border-left:3px solid var(--sigaccent,#0a84ff);padding-left:10px}
.sig-render.cols{display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.sig-render.small{font-size:12px}.sig-render.big{font-size:14px}.sig-render.big .sg-name{font-size:17px}
.sig-form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px 16px}
.sig-form label{font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sig-form input{font:inherit;font-size:13px;background:var(--glass-strong);border:1px solid var(--stroke);border-radius:10px;padding:7px 10px;outline:none}
.sig-opts{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px;align-items:center}
.sig-preview{margin:0 16px 14px;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--hair);color:#1c1f26}
.sig-acct-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 4px}
.sig-acct-tabs button{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--subtle);color:var(--ink2)}
.sig-acct-tabs button.on{background:var(--accent);color:#fff}
.chk-list{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;padding:9px 12px;border-radius:12px;background:var(--subtle)}
.chk.bad{background:rgba(255,59,48,.1);color:#b3261e}.chk.warn{background:rgba(255,159,10,.14);color:#8a5200}.chk.ok{color:var(--ok)}
.chk svg{flex:none;margin-top:2px}

/* custom dropdown buttons */
.dd-btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--subtle);border:1px solid transparent;border-radius:999px;padding:5px 9px 5px 11px;cursor:pointer;max-width:100%;transition:background .2s,border-color .2s}
.dd-btn:hover{background:var(--accent-soft)}
.dd-btn .dd-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .dd-chev{transform:rotate(90deg);opacity:.6;flex:none}
.dd-btn.sg-sel{padding:3px 8px 3px 9px;font-size:11px;background:var(--subtle);max-width:170px}
.dd-btn.fmt-sel{padding:4px 8px;font-size:12px;border-radius:8px;max-width:110px}
.dd-btn.v-voice{max-width:240px}
.dd-menu{max-height:min(60vh,420px);overflow-y:auto;min-width:200px}
.dd-menu button[disabled]{opacity:.4}
.mail-item.sel .dd-btn{background:rgba(255,255,255,.22);color:#fff}
.mail-item.sel .sg-pct{color:rgba(255,255,255,.85)}
.people-sort{display:flex;align-items:center;gap:10px;padding:4px 6px 10px;font-size:12px;color:var(--muted)}
.people-sort .m-time{margin-left:auto}
.read-bub{position:fixed;z-index:130;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;color:#fff;background:rgba(28,31,38,.94);padding:6px 11px;border-radius:999px;box-shadow:0 12px 28px -10px rgba(0,0,0,.5);animation:itemIn .2s var(--ease) both}
.read-bub.on{background:var(--badge)}

/* signature editor page */
.sig-wrap{flex:1;min-height:0;display:grid;grid-template-columns:170px minmax(0,1fr) minmax(240px,320px);gap:16px;padding:16px 22px 22px;overflow:auto}
.sig-side .nav-item.active{background:var(--accent);color:#fff}
.sig-side .nav-item.active .nav-count{background:#fff!important;color:var(--ok)!important}
.sig-side{display:flex;flex-direction:column;gap:2px}
.sig-side .nav-item{height:36px;font-size:12.5px}
.sig-main{display:flex;flex-direction:column;gap:6px}
.sig-main .sig-form{padding:0 0 8px;grid-template-columns:1fr 1fr}
.sig-main .sig-opts{padding:6px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opt-l{width:110px;flex:none;font-size:12px;font-weight:600;color:var(--muted)}
.swatches{display:flex;gap:6px;align-items:center}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px rgba(128,140,160,.35);cursor:pointer;transition:transform .2s}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--ink);transform:scale(1.1)}
.swatch.custom{background:var(--subtle);color:var(--muted);display:grid;place-items:center;font-weight:700;position:relative}
.swatch.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sig-prev-col{min-width:0}
.sig-mail{background:#fff;color:#1c1f26;border:1px solid var(--hair);border-radius:16px;padding:16px 18px;font-size:13.5px;line-height:1.55;box-shadow:0 20px 40px -24px rgba(20,60,120,.35)}
.sig-mail-head{font-size:12px;color:#777;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:12px;line-height:1.6}
.sig-mail-body{margin-bottom:12px}
@media (max-width:1100px){.sig-wrap{grid-template-columns:170px 1fr}.sig-prev-col{grid-column:1/-1}}
.sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;margin-left:10px;white-space:nowrap}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:micPulse 1.4s ease-in-out infinite}
.show-more{display:block;width:100%;margin:10px 0 4px;padding:10px;border-radius:14px;background:var(--subtle);font-size:12.5px;font-weight:600;color:var(--ink2)}
.show-more:hover{background:var(--accent-soft);color:var(--accent)}
.qa.del:hover{color:var(--badge);background:rgba(255,59,48,.1)}

.bin-bar{display:flex;flex-direction:column;gap:8px;padding:6px 6px 12px;position:sticky;top:-6px;z-index:3;background:rgba(247,250,254,.96);box-shadow:0 6px 16px -10px rgba(30,50,90,.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;margin-bottom:8px}
.bin-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bin-count{font-size:12.5px;color:var(--muted)}.bin-count b{color:var(--ink)}
.bin-row .spacer{flex:1}
.bin-q-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip-btn{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--subtle);color:var(--ink2);transition:background .2s}
.chip-btn:hover{background:var(--accent-soft);color:var(--accent)}
.bin-hint{font-size:11px;color:var(--muted);flex-basis:100%;margin-top:2px}
.set-btn[disabled]{opacity:.45;pointer-events:none}
.bin-clean{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--hair);padding-top:8px;max-height:260px;overflow-y:auto}
.bc-row{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:12px}
.bc-row:hover{background:var(--subtle)}
.bc-main{flex:1;min-width:0;font-size:13px}.bc-n{color:var(--muted);font-size:12px}

/* ============ SMART PLACEMENT (where should this email go?) ============
   A small naive-Bayes style scorer trained on what you have already done: where emails from the same
   sender, the same domain and the same group ended up, which words in the subject and preview went
   where, plus a few plain-English hints (unsubscribe, voucher, invoice...). Every tick or change you
   make is logged and feeds straight back in, so it gets sharper the more you use it. */
const DESTS=['active','done','junk','spam','bin'];
const DEST_LABEL={active:'Inbox',done:'Done',junk:'Junk',spam:'Spam',bin:'Bin'};
const DEST_ICON={active:'inbox',done:'tick',junk:'trash',spam:'spam',bin:'bin'};
const STOP=new Set('the a an and or of to in on for your you is are be this that with from at by it its we our as has have will can at just now here there'.split(' '));
function tokensOf(e){
  return [...new Set((e.subject+' '+e.snippet).toLowerCase().replace(/[^a-z0-9£%' ]+/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)&&!/^\d+$/.test(w)).slice(0,40))];
}
const HINTS=[
  [/unsubscribe|newsletter|offer|voucher|points|% off|sale|deal|promo|extra|discount|just for you|this week only|rewards?/i,'junk',1.2],
  [/won|winner|prize|claim now|urgent|verify your account|guaranteed|bitcoin|crypto|lottery|act now|click here|limited places|congratulations/i,'spam',2.2],
  [/invoice|booked|booking|confirmed|appointment|test|deadline|due|reminder|question|can you|could you|meeting|feedback|comments|please|thoughts/i,'active',1.0],
  [/receipt|dispatched|delivered|statement|roundup|summary|your order|return|has been received|monthly/i,'done',0.9],
  [/last chance|ends tonight|ends at midnight|flash sale/i,'bin',0.6],
];
function placementHistory(){
  // training rows: every email you have already dealt with, plus explicit decisions
  const rows=[];
  EMAILS.slice(0,3000).forEach(x=>{if(x.me)return;if(x.triaged)rows.push({sender:senderKey(x),domain:x.domain,group:groupOf(x),toks:tokensOf(x),dest:x.state,w:1});});
  DECISIONS.forEach(d=>rows.push(Object.assign({},d,{w:2})));
  return rows;
}
// The model is counted once per screen draw, not once per email on screen.
let PMODEL=null;
function placementModel(){
  const idx=tindex();
  if(PMODEL&&PMODEL.idx===idx&&PMODEL.dl===DECISIONS.length)return PMODEL;
  const cnt=()=>{const o={};DESTS.forEach(d=>o[d]=0);o._n=0;return o;};
  const M={idx,dl:DECISIONS.length,prior:cnt(),sender:new Map(),domain:new Map(),group:new Map(),tok:new Map(),cnt};
  const add=(map,k,dest,w)=>{let c=map.get(k);if(!c)map.set(k,c=cnt());c[dest]+=w;c._n+=w;};
  placementHistory().forEach(r=>{
    M.prior[r.dest]+=r.w;M.prior._n+=r.w;
    add(M.sender,r.sender,r.dest,r.w);add(M.domain,r.domain,r.dest,r.w);add(M.group,r.group,r.dest,r.w);
    r.toks.forEach(t=>add(M.tok,t,r.dest,r.w));
  });
  return PMODEL=M;
}
function suggestPlacement(e){
  const M=placementModel();const cnt=M.cnt;
  const A=0.5,K=DESTS.length;
  const sk=senderKey(e),dom=e.domain,grp=groupOf(e),toks=tokensOf(e);
  const copy=c=>{const o=cnt();if(c){DESTS.forEach(d=>o[d]=c[d]);o._n=c._n;}return o;};
  const prior=copy(M.prior),bySender=copy(M.sender.get(sk)),byDomain=copy(M.domain.get(dom)),byGroup=copy(M.group.get(grp)),byTok={};
  new Set(toks).forEach(t=>{const c=M.tok.get(t);if(c)byTok[t]=copy(c);});
  // leave this email's own past decisions out, as before
  DECISIONS.forEach(r=>{if(r.id!==e.id)return;const w=2;
    prior[r.dest]-=w;prior._n-=w;
    if(r.sender===sk){bySender[r.dest]-=w;bySender._n-=w;}
    if(r.domain===dom){byDomain[r.dest]-=w;byDomain._n-=w;}
    if(r.group===grp){byGroup[r.dest]-=w;byGroup._n-=w;}
    (r.toks||[]).forEach(t=>{if(byTok[t]){byTok[t][r.dest]-=w;byTok[t]._n-=w;}});
  });
  const lp=(c,d)=>Math.log((c[d]+A)/(c._n+A*K));
  const scores={},why={};
  DESTS.forEach(d=>{
    let sc=0.6*lp(prior,d);
    if(bySender._n)sc+=3.0*lp(bySender,d);
    if(byDomain._n&&byDomain._n!==bySender._n)sc+=1.2*lp(byDomain,d);
    if(byGroup._n)sc+=0.8*lp(byGroup,d);
    let tk=0;Object.values(byTok).forEach(c=>{if(c._n>=1)tk+=lp(c,d)-lp(prior,d);});
    sc+=0.5*Math.max(-4,Math.min(4,tk));
    HINTS.forEach(([re,hd,w])=>{if(re.test(e.subject+' '+e.snippet)){sc+=d===hd?w:-w*0.25;}});
    if(e.flagged&&d==='active')sc+=1.5;
    if(e.domain==='gmail.com'&&d==='active')sc+=1.0;

  const best=DESTS.slice().sort((a,b)=>scores[b]-scores[a])[0];
  const conf=ex[best]/tot;
  // reasons, in plain English
  const reasons=[];
  if(bySender._n){const n=bySender[best],t=bySender._n;reasons.push(`${senderDisplayName(e)}: ${Math.round(n)} of ${Math.round(t)} previous went to ${DEST_LABEL[best]}`);}
  else if(byDomain._n){reasons.push(`Other emails from ${dom}: mostly ${DEST_LABEL[DESTS.slice().sort((a,b)=>byDomain[b]-byDomain[a])[0]]}`);}
  else reasons.push('New sender, judged on the email itself');
  const hint=HINTS.find(([re,hd])=>hd===best&&re.test(e.subject+' '+e.snippet));
  if(hint)reasons.push('Wording looks like '+DEST_LABEL[best].toLowerCase()+' ("'+(e.subject+' '+e.snippet).match(hint[0])[0]+'")');
  if(byGroup._n&&byGroup[best]/byGroup._n>0.5)if(grp!==NOGROUP)reasons.push(`Most of your ${grp} emails end up in ${DEST_LABEL[best]}`);
  return {dest:best,conf,reasons,scores};
}
function logDecision(e,dest){
  DECISIONS.push({id:e.id,sender:senderKey(e),domain:e.domain,group:groupOf(e),toks:tokensOf(e),dest});
  threadMsgs(e).forEach(m=>{m.triaged=true;});

function attachToSuggest(input){
  if(!input)return;
  let box=null;
  const close=()=>{if(box){box.remove();box=null;}};
  const render=()=>{
    const raw=input.value;const parts=raw.split(/,\s*/);const q=(parts[parts.length-1]||'').trim().toLowerCase();
    if(q.length<1){close();return;}
    const hits=contactsInScope().filter(c=>(c.name+' '+c.email).toLowerCase().includes(q)).slice(0,6);
    if(!hits.length){close();return;}
    if(!box){box=document.createElement('div');box.className='pop-menu to-suggest';document.body.appendChild(box);}
    const r=input.getBoundingClientRect();box.style.left=r.left+'px';box.style.top=(r.bottom+4)+'px';box.style.minWidth=Math.max(280,r.width)+'px';
    box.innerHTML='<div class="gp-label">People you have emailed</div>'+hits.map(c=>`<button data-pick="${esc(c.email)}"><span class="m-avatar" style="background:${avBg(c.email,c.name)};width:24px;height:24px;font-size:10px;border-radius:7px">${initials(c.name)}${logoTag(c.email)}</span><span style="min-width:0"><div style="font-weight:600">${esc(c.name)}</div><div style="font-size:11.5px;color:var(--muted)">${esc(c.email)} · ${c.received+c.sent} emails</div></span></button>`).join('');
    box.querySelectorAll('[data-pick]').forEach(b=>b.onmousedown=ev=>{ev.preventDefault();parts[parts.length-1]=b.dataset.pick;input.value=parts.join(', ');close();input.dispatchEvent(new Event('input'));});
  };
  input.addEventListener('input',render);input.addEventListener('focus',render);
  input.addEventListener('blur',()=>setTimeout(close,120));
  input.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if(ev.key==='Enter'&&box){const f=box.querySelector('[data-pick]');if(f){ev.preventDefault();f.onmousedown(ev);}}});
}

/* ============ DROPDOWNS (every <select> becomes a SmartMail menu; the select stays as the value holder) ============ */
function upgradeSelect(sel){
  if(sel.dataset.dd||sel.closest('.helper'))return;sel.dataset.dd='1';
  const btn=document.createElement('button');btn.type='button';btn.className='dd-btn '+(sel.className||'');btn.setAttribute('data-ddbtn','1');
  if(sel.dataset.tip)btn.dataset.tip=sel.dataset.tip;
  const label=()=>{const o=sel.options[sel.selectedIndex];return o?o.textContent:'';};
  const paint=()=>{btn.innerHTML='<span class="dd-lbl">'+esc(label())+'</span>'+ic('chev',11).replace('<svg','<svg class="dd-chev"');};
  paint();
  sel.style.display='none';sel.insertAdjacentElement('afterend',btn);
  btn.onclick=ev=>{
    ev.stopPropagation();ev.preventDefault();
    const pop=$('gistPop');pop.className='pop-menu dd-menu';
    let html='';
    [...sel.children].forEach(ch=>{
      if(ch.tagName==='OPTGROUP'){html+='<div class="gp-label">'+esc(ch.label)+'</div>';[...ch.children].forEach(o=>{html+=`<button data-ddv="${esc(o.value)}" ${o.disabled?'disabled':''}>${esc(o.textContent)}${o.selected?'<span class="cur">✓</span>':''}</button>`;});}
      else html+=`<button data-ddv="${esc(ch.value)}" ${ch.disabled?'disabled':''}>${esc(ch.textContent)}${ch.selected?'<span class="cur">✓</span>':''}</button>`;
    });
    pop.innerHTML=html;pop.hidden=false;
    const r=btn.getBoundingClientRect();
    pop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-pop.offsetWidth-8))+'px';
    pop.style.top=(r.bottom+6+pop.offsetHeight>window.innerHeight-8?r.top-pop.offsetHeight-6:r.bottom+6)+'px';
    pop.querySelectorAll('[data-ddv]').forEach(b=>b.onclick=x=>{x.stopPropagation();sel.value=b.dataset.ddv;paint();pop.hidden=true;sel.dispatchEvent(new Event('change',{bubbles:true}));});
    const close=x=>{if(!pop.contains(x.target)){pop.hidden=true;document.removeEventListener('pointerdown',close,true);}};
    setTimeout(()=>document.addEventListener('pointerdown',close,true),0);
  };
  btn.onmousedown=ev=>ev.preventDefault();
  sel.addEventListener('change',paint);
  sel._ddPaint=paint;
}
function upgradeSelects(root){(root||document).querySelectorAll('select:not([data-dd])').forEach(upgradeSelect);}
new MutationObserver(()=>upgradeSelects()).observe(document.body,{childList:true,subtree:true});

/* ============ HOVER TIPS (data-tip="Title|What it is for") ============ */
const TIPS={
  active:'Active|Emails still to deal with. New mail lands here.',
  done:'Done|Important emails you have read or replied to and are finished with. Kept for good, just out of the way.',
  junk:'Junk|Rubbish you do not need but are keeping just in case: offers, newsletters, receipts you might want later.',
  spam:'Spam|Scams and senders you never want to hear from. Kept but hidden.',
  bin:'Bin|Things you have thrown away. Kept until you choose Delete forever.',
};
(function(){
  const tip=$('tip');let timer=null,cur=null;
  function show(el){
    const raw=el.dataset.tip||'';if(!raw)return;
    const [t,d]=raw.split('|');
    tip.innerHTML=(d?'<b>'+esc(t)+'</b>'+esc(d):esc(t))+(el.dataset.tipkey?'<span class="tk">'+esc(el.dataset.tipkey)+'</span>':'');
    const r=el.getBoundingClientRect();
    tip.style.left='0';tip.style.top='0';tip.classList.add('show');
    const w=tip.offsetWidth,h=tip.offsetHeight;
    let x=r.left+r.width/2-w/2,y=r.bottom+8;
    if(y+h>window.innerHeight-8)y=r.top-h-8;
    x=Math.max(8,Math.min(window.innerWidth-w-8,x));
    tip.style.left=x+'px';tip.style.top=y+'px';cur=el;
  }
  function hide(){clearTimeout(timer);tip.classList.remove('show');cur=null;}
  document.addEventListener('pointerover',ev=>{
    const el=ev.target.closest('[data-tip]');
    if(!el||el===cur)return;
    clearTimeout(timer);tip.classList.remove('show');
    timer=setTimeout(()=>show(el),420);
  });
  document.addEventListener('pointerout',ev=>{const el=ev.target.closest('[data-tip]');if(el&&!el.contains(ev.relatedTarget))hide();});
  document.addEventListener('focusin',ev=>{const el=ev.target.closest('[data-tip]');if(el){clearTimeout(timer);timer=setTimeout(()=>show(el),300);}});
  document.addEventListener('focusout',hide);
  document.addEventListener('pointerdown',hide,true);
  window.addEventListener('scroll',hide,true);
})();

function placePill(pill,wrap,sel){
  const t=wrap.querySelector(sel);
  if(!t||!wrap.offsetWidth||!t.offsetWidth){pill.classList.remove('show');return;}
  const hidden=!pill.classList.contains('show');
  if(hidden){pill.style.transition='opacity .3s ease';}

}

const BINSEL={set:new Set(),anchor:null,list:[],cleanOpen:false,drag:null};
function binSize(list){let n=0;list.forEach(e=>threadMsgs(e).forEach(m=>{n+=((m.body||[]).join(' ').length+(m.subject||'').length+600)*1.1;(m.attachments||[]).forEach(a=>n+=a.size||0);}));return n;}
function binPicked(){return BINSEL.list.filter(e=>BINSEL.set.has(threadKey(e)));}
const PROMO=/sale|% off|offer|deal|discount|voucher|newsletter|unsubscribe|last chance|ends tonight|new arrivals|just for you|points|rewards|webinar|promo|flash|black friday|limited time/i;
function cleanupGroups(list){
  const repliedTo=new Set(EMAILS.filter(m=>m.me).map(m=>threadFace(m).fromEmail));
  const g={};const now=Date.now();
  list.forEach(e=>{const f=threadFace(e);const k=(f.fromEmail||'').toLowerCase();(g[k]=g[k]||{name:f.fromName,email:k,items:[]}).items.push(e);});
  return Object.values(g).map(x=>{
    const n=x.items.length;const promo=x.items.filter(e=>PROMO.test(e.subject+' '+e.snippet)).length;
    const old=x.items.filter(e=>e.ts&&e.ts<1e12*1.9&&now-e.ts>365*864e5).length;
    const noreply=/no-?reply|newsletter|marketing|news@|offers@|info@|hello@|notifications?@/i.test(x.email);
    const never=!repliedTo.has(x.email);
    let score=n*1+promo*2+old*1.5+(noreply?n*1.5:0)+(never?n:0)-(x.email.endsWith('gmail.com')&&!noreply?n*3:0);
    const why=[];if(promo)why.push(promo===n?'all promotions':promo+' promotions');if(noreply)why.push('automated sender');if(never)why.push('you never replied');if(old)why.push(old+' over a year old');
    return Object.assign(x,{n,score,why,size:binSize(x.items)});
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8);
}
function binBarHtml(list){

function binRefresh(){renderListInner();}
function binToggle(tk,on){if(on===undefined)on=!BINSEL.set.has(tk);if(on)BINSEL.set.add(tk);else BINSEL.set.delete(tk);}

function binPaintBar(){const bar=$('listScroll').querySelector('.bin-bar');if(!bar)return;const tmp=document.createElement('div');tmp.innerHTML=binBarHtml(BINSEL.list);bar.replaceWith(tmp.firstElementChild);wireBinBar(BINSEL.list);}

function wireBinBar(list){

function wireBinSelect(list){
  wireBinBar(list);
  const box=$('listScroll');
  box.onpointerdown=ev=>{
    const row=ev.target.closest('.mail-item.pickable');if(!row||ev.button!==0)return;
    if(ev.target.closest('[data-qforever],[data-qrestore],[data-qmove],[data-personopen],.bin-bar'))return;
    BINSEL.drag={start:row,y:ev.clientY,moved:false,mode:!BINSEL.set.has(row.dataset.tk),last:row,timer:null,cy:ev.clientY};
  };
  box.onpointermove=ev=>{
    const d=BINSEL.drag;if(!d)return;d.cy=ev.clientY;
    if(!d.moved&&Math.abs(ev.clientY-d.y)<6)return;
    if(!d.moved){d.moved=true;box.classList.add('dragsel');binToggle(d.start.dataset.tk,d.mode);binPaintRow(d.start);
      d.timer=setInterval(()=>{const r=box.getBoundingClientRect();if(d.cy<r.top+40)box.scrollTop-=18;else if(d.cy>r.bottom-40)box.scrollTop+=18;else return;sweep(r.left+60,d.cy);},40);}
    sweep(ev.clientX,ev.clientY);
  };
  const sweep=(x,y)=>{const d=BINSEL.drag;if(!d)return;const el=document.elementFromPoint(x,Math.max(box.getBoundingClientRect().top+2,Math.min(box.getBoundingClientRect().bottom-2,y)));const row=el&&el.closest('.mail-item.pickable');if(!row||row===d.last)return;
    const rows=[...box.querySelectorAll('.mail-item.pickable')];const a=rows.indexOf(d.last),b=rows.indexOf(row);const [i,j]=a<b?[a,b]:[b,a];rows.slice(i,j+1).forEach(r=>{binToggle(r.dataset.tk,d.mode);binPaintRow(r);});d.last=row;binPaintBar();};
  const end=()=>{const d=BINSEL.drag;if(!d)return;clearInterval(d.timer);box.classList.remove('dragsel');if(d.moved){BINSEL.anchor=d.last.dataset.tk;binPaintBar();setTimeout(()=>{BINSEL.drag=null;},0);}else BINSEL.drag=null;};
  box.onpointerup=end;box.onpointerleave=ev=>{if(BINSEL.drag&&!BINSEL.drag.moved)BINSEL.drag=null;};
  document.addEventListener('pointerup',end,{once:true});
}

function suggestIcon(name){const n=String(name||'').toLowerCase();const h=ICON_HINTS.find(([,re])=>re.test(n));return h?h[0]:'folder';}
function setGroupIcon(g,icon){CUSTOM_ICONS[g]=icon;GROUP_ICON[g]=icon;}
function renameGroup(from,to){
  const i=CUSTOM_GROUPS.indexOf(from);if(i>=0)CUSTOM_GROUPS[i]=to;
  for(const k in GROUP_OVERRIDES)if(GROUP_OVERRIDES[k]===from)GROUP_OVERRIDES[k]=to;
  if(CUSTOM_ICONS[from]){setGroupIcon(to,CUSTOM_ICONS[from]);delete CUSTOM_ICONS[from];delete GROUP_ICON[from];}
  if(state.openGroups[from]){state.openGroups[to]=true;delete state.openGroups[from];}
  if(state.view.type==='group'&&state.view.group===from)state.view.group=to;
}
function deleteGroup(g){
  const i=CUSTOM_GROUPS.indexOf(g);if(i>=0)CUSTOM_GROUPS.splice(i,1);
  for(const k in GROUP_OVERRIDES)if(GROUP_OVERRIDES[k]===g)delete GROUP_OVERRIDES[k];

  if(state.view.type==='group'&&state.view.group===g)state.view={type:'inbox'};
}

function acctStats(id){let total=0,active=0,done=0,sent=0,old=Infinity;EMAILS.forEach(e=>{if(e.account!==id)return;total++;if(e.me)sent++;else if(e.state==='active')active++;else if(e.state==='done')done++;if(e.ts&&e.ts<old)old=e.ts;});return {total,active,done,sent,oldest:old<Infinity?new Date(old).toLocaleDateString('en-GB',{month:'short',year:'numeric'}):''};}

/* ============ RESET: everything back into Active, sorting starts from scratch ============ */
async function resetSorting(why){
  for(let i=0;i<60&&Gmail.busy;i++)await new Promise(r=>setTimeout(r,500)); // let any catch-up finish first
  Gmail.holdSync=true;
  try{await resetSorting0(why);}finally{Gmail.holdSync=false;}
  if(Gmail.on){try{for(const acc of Gmail.accounts){if(!acc.needsTap)await Gmail.resyncStates(acc);}}catch(e){}invalidateThreads();renderAll();}
}
async function resetSorting0(why){

/* ============ SPEED SORT: one sender at a time, one key each ============
   Works on ALL your mail from that sender, whatever box it is in now, so it
   doesn't matter whether Gmail had already archived it. */
const SORTED_SENDERS=new Set();
const SPEED={open:false,queue:[],idx:0,hist:[],group:null,t0:0,n0:0,totalE:0,sortedE:0,finish:false,ov:{},q:'',lim:120};
const SPEED_OV=[['','Same as the rest'],['done','Done'],['active','Active'],['junk','Junk'],['bin','Bin'],['skip','Leave out']];
const SPEED_ACTS=[['d','done','Done','tick'],['r','recent','Recent in Active','inbox'],['a','active','All in Active','inbox'],['j','junk','Junk','trash'],['s','spam','Spam','spam'],['b','bin','Bin','bin']];
const SPEED_ACT_LABEL={done:'Done',recent:'Recent in Active',active:'All in Active',junk:'Junk',spam:'Spam',bin:'Bin'};
function speedDate(e){if(!e.ts)return e.day||'';const d=new Date(e.ts);const now=new Date();return d.toLocaleDateString('en-GB',d.getFullYear()===now.getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'});}
function speedScope(e){return !e.me&&(state.account==='all'||e.account===state.account);}
function speedGroups(){const pref=['People','Shopping','Finance','Work','Subscriptions','Social','Updates','Travel','Property','Uni','Driving'];return [...CUSTOM_GROUPS,...pref.filter(g=>BASE_GROUPS.includes(g)),...BASE_GROUPS.filter(g=>!pref.includes(g))];}
function speedBuckets(){
  const by=new Map();
  EMAILS.forEach(e=>{
    if(!speedScope(e))return;const k=senderKey(e);if(SORTED_SENDERS.has(k))return;
    let r=by.get(k);if(!r){r={key:k,items:[],latest:0,first:Infinity,sample:e,counts:{active:0,done:0,junk:0,spam:0,bin:0},promo:0,bulk:0,names:new Set()};by.set(k,r);}
    if(r.names.size<40)r.names.add(e.fromName||e.fromEmail);
    r.items.push(e);r.counts[e.state]=(r.counts[e.state]||0)+1;
    if((e.ts||0)>=r.latest){r.latest=e.ts||0;r.sample=e;}if(e.ts&&e.ts<r.first)r.first=e.ts;
    const t=(e.subject||'')+' '+(e.snippet||'');if(PROMO.test(t))r.promo++;if(e.bulk||e.cat==='promotions')r.bulk++;
  });
  return [...by.values()].sort((a,b)=>b.items.length-a.items.length||b.latest-a.latest);
}
function speedSuggest(r){
  if(r.sug)return r.sug;
  let g=suggestGroup(r.sample);const n=r.items.length;
  const replied=SPEED.replied.has(r.key);
  if(g==='People'&&!isPersonalDomain(r.sample.domain)&&!replied&&!GROUP_OVERRIDES[r.key])g=r.names&&r.names.size>1?'Updates':g;
  const person=isPersonalDomain(r.sample.domain)||(g==='People'&&replied);
  const jobs=r.items.slice(0,40).filter(e=>/job alert|\bjobs?\s*[:|-]|new jobs|jobs for you|vacanc|hiring|apply now|recommended jobs/i.test((e.subject||'')+' '+(e.fromName||''))).length;
  const ago=(Date.now()-r.latest)/864e5;
  let act,why;
  if(jobs>=Math.min(5,n*0.4)&&!replied){act='junk';why='Job alerts';if(g==='People')g='Updates';}
  else if(person||replied){act=ago<30?'recent':'done';why=(SPEED.replied.has(r.key)?'You have emailed them':'A person')+(ago<30?', recent mail stays in Active':', nothing recent');}
  else if(r.promo/n>0.4||r.bulk/n>0.6||g==='Subscriptions'){act='junk';why='Mostly offers and newsletters';}
  else if(g==='Social'){act='junk';why='Social notifications';}
